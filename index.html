   Search by username, request, accept/decline, and view a friend's
   read-only summary — never their raw workouts/food/weight, only the
   public_snapshots row their client built from buildPublicSnapshot().
   No generic feed: this is mutual visibility of a summary, on purpose.
   ================================================================== */
let FR = { q: "", results: [], incoming: [], outgoing: [], friends: [] };

function requireAccount() {
  if (!sbConfigured()) { toast("Accounts aren't configured on this deployment yet."); return false; }
  if (!AUTH_USER || !AUTH_PROFILE) { toast("Sign in and set a username first, in Settings."); return false; }
  return true;
}
async function openFriends() {
  if (!requireAccount()) return;
  await refreshFriendLists();
  modal({ title: "Friends", cls: "s-core", body: friendsBody(), footer: '<button class="btn pri s-core" data-a="close">Close</button>' });
  const frq = $("#fr_q"); if (frq) frq.oninput = e => onFriendSearchInput(e.target.value);
}
async function refreshFriendLists() {
  const uid = AUTH_USER.id;
  const { data: incoming } = await sbClient.from("friendships").select("id, user_id, profiles!friendships_user_id_fkey(username)").eq("friend_id", uid).eq("status", "pending");
  const { data: outgoing } = await sbClient.from("friendships").select("id, friend_id, profiles!friendships_friend_id_fkey(username)").eq("user_id", uid).eq("status", "pending");
  const { data: accepted } = await sbClient.from("friendships")
    .select("id, user_id, friend_id, profiles_a:profiles!friendships_user_id_fkey(username), profiles_b:profiles!friendships_friend_id_fkey(username)")
    .eq("status", "accepted").or(`user_id.eq.${uid},friend_id.eq.${uid}`);
  FR.incoming = incoming || [];
  FR.outgoing = outgoing || [];
  FR.friends = (accepted || []).map(row => {
    const isMe = row.user_id === uid;
    return { friendshipId: row.id, id: isMe ? row.friend_id : row.user_id, username: (isMe ? row.profiles_b : row.profiles_a).username };
  });
}
function friendsBody() {
  let h = '<div class="fl" style="margin-bottom:12px"><input id="fr_q" placeholder="Search a username…" autocomplete="off"></div>' +
    '<div id="fr_results"></div>';
  if (FR.incoming.length) {
    h += '<div class="eb" style="margin:14px 0 7px">Requests</div><div class="stack" style="gap:7px">' +
      FR.incoming.map(r => '<div class="btw"><span>@' + esc((r.profiles || {}).username || "?") + '</span>' +
        '<span class="row" style="gap:6px"><button class="btn xs pri s-core" data-a="fr-accept" data-id="' + r.id + '">Accept</button>' +
        '<button class="btn xs gh" data-a="fr-decline" data-id="' + r.id + '">Decline</button></span></div>').join("") + "</div>";
  }
  if (FR.outgoing.length) {
    h += '<div class="eb" style="margin:14px 0 7px">Sent — waiting</div><div class="stack" style="gap:5px">' +
      FR.outgoing.map(r => '<div class="ti mu">@' + esc((r.profiles || {}).username || "?") + "</div>").join("") + "</div>";
  }
  h += '<div class="eb" style="margin:14px 0 7px">Friends' + (FR.friends.length ? " · " + FR.friends.length : "") + "</div>";
  h += FR.friends.length
    ? '<div class="stack" style="gap:6px">' + FR.friends.map(f =>
      '<button class="item s-core" data-a="fr-view" data-id="' + f.id + '" data-username="' + esc(f.username) + '" style="text-align:left"><span class="tt">@' + esc(f.username) + "</span></button>").join("") + "</div>"
    : '<p class="ti mu" style="margin:0">No friends yet — search a username above.</p>';
  return h;
}
let frSearchT = null;
function onFriendSearchInput(q) {
  clearTimeout(frSearchT);
  frSearchT = setTimeout(() => searchUsers(q), 300);
}
async function searchUsers(q) {
  q = (q || "").trim();
  const host = $("#fr_results"); if (!host) return;
  if (q.length < 2) { host.innerHTML = ""; return; }
  const { data } = await sbClient.from("profiles").select("id, username").ilike("username", q + "%").limit(8);
  const known = new Set([AUTH_USER.id, ...FR.friends.map(f => f.id), ...FR.outgoing.map(o => o.friend_id)]);
  const list = (data || []).filter(u => !known.has(u.id));
  host.innerHTML = list.length
    ? '<div class="stack" style="gap:5px">' + list.map(u =>
      '<div class="btw"><span>@' + esc(u.username) + '</span><button class="btn xs pri s-core" data-a="fr-request" data-id="' + u.id + '">Add</button></div>').join("") + "</div>"
    : '<p class="ti mu" style="margin:6px 0 0">No one found.</p>';
}
async function sendFriendRequest(id) {
  const { error } = await sbClient.from("friendships").insert({ user_id: AUTH_USER.id, friend_id: id, status: "pending" });
  if (error) { toast(error.message.includes("duplicate") ? "Already sent." : error.message); return; }
  toast("Request sent");
  await refreshFriendLists();
  const host = document.querySelector(".modal .bd"); if (host) host.innerHTML = friendsBody();
}
async function respondFriendRequest(id, accept) {
  if (accept) await sbClient.from("friendships").update({ status: "accepted" }).eq("id", id);
  else await sbClient.from("friendships").delete().eq("id", id);
  await refreshFriendLists();
  const host = document.querySelector(".modal .bd"); if (host) host.innerHTML = friendsBody();
  toast(accept ? "Friend added" : "Declined");
}
async function viewFriendProfile(id, username) {
  const { data, error } = await sbClient.from("public_snapshots").select("snapshot, updated_at").eq("user_id", id).maybeSingle();
  if (error || !data) { toast("Couldn't load @" + username + "'s stats — they may have sync turned off."); return; }
  const s = data.snapshot || {};
  const body = '<div class="grid g2" style="gap:9px;margin-bottom:14px">' +
    miniStat("Level", s.level != null ? s.level : "—", "") +
    miniStat("XP", s.xp != null ? nf(s.xp) : "—", "") +
    miniStat("Streak", s.streak != null ? s.streak : "—", "days") +
    miniStat("Workouts", s.workoutsTotal != null ? s.workoutsTotal : "—", "") + "</div>" +
    (s.padel && (s.padel.wins || s.padel.losses) ? '<div class="eb" style="margin-bottom:8px">Padel</div>' +
      '<p class="ti" style="margin:0 0 14px">' + s.padel.matches + " matches · " + s.padel.wins + "–" + s.padel.losses + "</p>" : "") +
    (s.topLifts && s.topLifts.length ? '<div class="eb" style="margin-bottom:8px">Top lifts</div><div class="stack" style="gap:5px">' +
      s.topLifts.map(l => '<div class="btw"><span class="ti">' + esc(l.n) + '</span><span class="mo">' + wTxt(l.w) + " × " + l.r + "</span></div>").join("") + "</div>"
      : "") +
    '<p class="ti mu" style="margin:14px 0 0">Only what @' + esc(username) + " chooses to share is shown here — not their food, weight or photos.</p>";
  modal({ title: "@" + username, cls: "s-core", body, footer: '<button class="btn pri s-core" data-a="close">Close</button>' });
}

/* ==================================================================
   PROGRESS  =  weight  +  trends

function viewProgress() {

  let h = '<div class="hd s-weight"><div><div class="eb">The long view</div><h1>Progress</h1>' +
    '<div class="sub">' + S.weights.length + " weigh-ins · " + S.workouts.length + " workouts · " + S.padel.length + " padel</div></div>" +
    '<button class="btn pri s-weight" data-a="addweight">' + I.plus + "Log weight</button></div>" +
    '<div class="seg s-weight k" style="width:100%;margin-bottom:14px;flex-wrap:wrap">' +
    [["body", "Body"], ["strength", "Strength"], ["nutrition", "Nutrition"], ["padel", "Padel"], ["photos", "Photos"]].map(([k, l]) =>
      '<button data-a="ptab" data-t="' + k + '" class="' + (tab === k ? "on" : "") + '" style="flex:1;min-width:64px">' + l + "</button>").join("") + "</div>";
  const PANELS = { body: weightPanel, strength: strengthPanel, nutrition: nutritionPanel, padel: padelPanel, photos: viewPhotos };
  return h + PANELS[tab]();
}
function weightPanel() {
  const t = trendSeries();
  const cur = currentWeight();
  const raw = latestRaw();
  const rate = weightRate(21);
  const p = S.profile;
  const mode = V.wmode || "month";
  const n = mode === "week" ? 14 : mode === "month" ? 60 : 180;
  const win = t.filter(x => x.date >= shift(today(), -n));
  const wavg = weeklyAvgWeight(today());
  const prevAvg = weeklyAvgWeight(shift(today(), -7));
  const change = win.length && cur != null ? cur - win[0].trend : null;

  let h = '<div class="grid g4" style="margin-bottom:13px">' +
    '<div class="stat s-weight"><div class="lb">Trend weight</div><div class="vl">' + (cur != null ? kgOut(cur) : "—") + "<small>" + wU() + "</small></div>" +
    '<div class="ft">' + (raw ? "scale " + wTxt(raw.kg) : "no entries yet") + "</div></div>" +
    '<div class="stat s-weight"><div class="lb">7-day average</div><div class="vl">' + (wavg != null ? kgOut(wavg) : "—") + "<small>" + wU() + "</small></div>" +
    '<div class="ft">' + (wavg != null && prevAvg != null ? '<span class="dl ' + (wavg < prevAvg ? "up" : wavg > prevAvg ? "dn" : "fl") + '">' +
      (wavg > prevAvg ? "+" : "") + round(kgOut(Math.abs(wavg - prevAvg)) * (wavg < prevAvg ? -1 : 1), 2) + " " + wU() + "</span> vs last week" : "needs two weeks") + "</div></div>" +
    '<div class="stat s-weight"><div class="lb">Rate</div><div class="vl">' + (rate != null ? (rate > 0 ? "+" : "−") + round(kgOut(Math.abs(rate)), 2) : "—") + "<small>" + wU() + "/wk</small></div>" +
    '<div class="ft">' + (rate != null ? "three-week trend" : "log a few more") + "</div></div>" +
    '<div class="stat s-weight"><div class="lb">' + (p.targetKg ? "To goal" : "Change") + '</div><div class="vl">' +
    (p.targetKg && cur != null ? (Math.abs(cur - p.targetKg) < 0.1 ? "0" : (cur > p.targetKg ? "" : "+") + round(kgOut(Math.abs(cur - p.targetKg)) * (cur > p.targetKg ? -1 : 1), 1))
      : change != null ? (change > 0 ? "+" : "−") + round(kgOut(Math.abs(change)), 1) : "—") + "<small>" + wU() + "</small></div>" +
    '<div class="ft">' + (p.targetKg ? "goal " + wTxt(p.targetKg) + projText(cur, p.targetKg, rate) : "over the window below") + "</div></div></div>";

  h += '<div class="card s-weight" style="margin-bottom:13px"><div class="btw wr" style="margin-bottom:11px;gap:10px">' +
    '<div class="eb">Weight over time</div>' +
    '<div class="seg">' + [["week", "2 wk"], ["month", "2 mo"], ["all", "6 mo"]].map(([k, l]) =>
      '<button data-a="wmode" data-m="' + k + '" class="' + (mode === k ? "on" : "") + '">' + l + "</button>").join("") + "</div></div>" +
    (win.length > 1 ? lineChart(win.map(x => ({ v: kgOut(x.trend), v2: kgOut(x.raw), l: fmtShort(x.date), t: fmtD(x.date) + " — scale " + wTxt(x.raw) + ", trend " + wTxt(x.trend) })),
      { fmt: v => round(v, 1), band: p.targetKg ? kgOut(p.targetKg) : null, label: "Weight trend", h: 168 })
      : '<div class="empty" style="padding:24px">' + I.weight + "<h3>Not enough data</h3><p class=\"ti\">Log two weigh-ins to see a trend.</p></div>") +
    '<div class="legend" style="margin-top:9px">' +
    '<span><span class="dot" style="background:var(--wt)"></span>Trend (used by the app)</span>' +
    '<span><span class="dot" style="background:var(--text-3)"></span>Scale reading</span>' +
    (p.targetKg ? '<span><span class="dot" style="background:var(--text-2)"></span>Goal</span>' : "") + "</div>" +
    '<p class="ti mu" style="margin:11px 0 0;max-width:70ch">Daily readings swing with water and salt. The trend line absorbs that, and it is what feeds your calorie target.</p></div>';

  h += '<div class="grid split" style="grid-template-columns:1fr 1.2fr">' +
    '<div class="card s-weight"><div class="eb" style="margin-bottom:11px">Goal</div>' +
    '<div class="grid g2 tt" style="gap:11px">' +
    fl("Target (" + wU() + ")", '<input type="number" id="gw" step="0.5" inputmode="decimal" value="' + (p.targetKg ? kgOut(p.targetKg) : "") + '" placeholder="optional">') +
    fl("Pace (" + wU() + "/week)", '<input type="number" id="gr" step="0.05" inputmode="decimal" value="' + round(kgOut(p.rate), 2) + '">') + "</div>" +
    '<button class="btn bl s-weight" style="margin-top:11px" data-a="savegoal">' + I.check + "Save goal</button>" +
    '<p class="ti mu" style="margin:11px 0 0">0.25–0.75 ' + wU() + " a week is the range most people keep muscle through.</p></div>";

  const list = wLog().slice().reverse().slice(0, 30);
  h += '<div class="card s-weight"><div class="eb" style="margin-bottom:9px">Entries</div>' +
    (list.length ? '<div class="sx"><table class="dt"><thead><tr><th>Date</th><th>Scale</th><th>Trend</th><th>Change</th><th></th></tr></thead><tbody>' +
      list.map((w, i) => {
        const tr = t.find(x => x.date === w.date);
        const prev = list[i + 1];
        const d = prev ? w.kg - prev.kg : null;
        return "<tr><td>" + fmtD(w.date) + '</td><td class="mo"><b>' + wTxt(w.kg) + '</b></td><td class="mo mu">' + (tr ? wTxt(tr.trend) : "—") + "</td>" +
          '<td class="mo" style="color:' + (d == null ? "var(--text-3)" : d < 0 ? "var(--good)" : d > 0 ? "var(--crit)" : "var(--text-3)") + '">' +
          (d == null ? "—" : (d > 0 ? "+" : "−") + round(kgOut(Math.abs(d)), 1)) + "</td>" +
          '<td><button class="btn xs gh" data-a="delweight" data-date="' + w.date + '" aria-label="Delete entry">' + I.trash + "</button></td></tr>";
      }).join("") + "</tbody></table></div>"
      : '<div class="empty" style="padding:20px">' + I.weight + "<h3>No weigh-ins</h3><p class=\"ti\">Same time each morning gives the cleanest trend.</p></div>") + "</div></div>";
  return h;
}
/* shared by strength/nutrition/padel — one window control, one weekly bucketing */
function progressWindow() {
  const range = V.arange || 56;
  const days = Array.from({ length: range }, (_, i) => shift(today(), -(range - 1 - i)));
  const wk = [];
  for (let d = weekStart(days[0]); d <= today(); d = shift(d, 7)) {
    const we = shift(d, 6), dd = [];
    for (let x = d; x <= we; x = shift(x, 1)) dd.push(x);
    const food = dd.map(x => S.food.filter(f => f.date === x).reduce((a, f) => a + f.kcal, 0)).filter(v => v > 0);
    const pad = S.padel.filter(p => p.date >= d && p.date <= we);
    wk.push({
      start: d, label: "Week of " + fmtShort(d),
      gym: S.workouts.filter(w => w.date >= d && w.date <= we).length,
      padel: pad.length, padelMin: pad.reduce((a, p) => a + p.minutes, 0),
      padelW: pad.filter(p => p.result === "win").length, padelL: pad.filter(p => p.result === "loss").length,
      avgKcal: food.length ? Math.round(food.reduce((a, b) => a + b, 0) / food.length) : null,
      loggedDays: food.length
    });
  }
  return { range, days, wk };
}
function windowSeg(range) {
  return '<div class="btw wr" style="margin-bottom:13px;gap:10px"><div class="eb">Window</div>' +
    '<div class="seg">' + [[28, "4 wk"], [56, "8 wk"], [112, "16 wk"]].map(([v, l]) =>
      '<button data-a="arange" data-v="' + v + '" class="' + (range === v ? "on" : "") + '">' + l + "</button>").join("") + "</div></div>";
}
function strengthPanel() {
  const { range, wk } = progressWindow();
  let h = windowSeg(range);
  const trained = [...new Set(S.workouts.flatMap(w => (w.exercises || []).map(e => e.exId)))].filter(id => LIBM[id]);
  if (!trained.length) return h + '<div class="card"><div class="empty">' + I.gym + "<h3>Nothing to chart yet</h3>" +
    '<p class="ti">Log a couple of workouts and your lifts fill in here.</p></div></div>';

  h += '<div class="card s-move" style="margin-bottom:13px"><div class="eb" style="margin-bottom:9px">Workouts per week</div>' +
    barChart(wk.map(w => ({ v: w.gym, c: "var(--out)", o: w.gym ? 1 : .2, t: w.label + " — " + w.gym })), { px: 108, label: "Workouts per week" }) +
    '<div class="legend" style="margin-top:7px;justify-content:space-between"><span>' + fmtShort(wk[0].start) + "</span><span>This week</span></div></div>";

  const sel = trained.includes(V.progEx) ? V.progEx : trained[0];
  const eh = exHistory(sel), pr = prFor(sel);
  h += '<div class="sh"><h2>Progression</h2></div><div class="card s-move">' +
    '<div class="btw wr" style="gap:12px;margin-bottom:13px"><div style="flex:1;min-width:190px"><div class="eb" style="margin-bottom:5px">Exercise</div>' +
    '<select id="pgsel">' + trained.map(id => '<option value="' + id + '"' + (id === sel ? " selected" : "") + ">" + esc(LIBM[id].n) + "</option>").join("") + "</select></div>" +
    '<div class="row wr" style="gap:8px">' + miniStat("Best set", pr.w ? wTxt(pr.w) + " × " + pr.r : "—", "") +
    miniStat("Est. 1RM", pr.e1 ? wTxt(pr.e1) : "—", "") + miniStat("Sessions", eh.length, "") + "</div></div>" +
    '<div class="grid g2" style="gap:16px"><div><div class="eb" style="margin-bottom:7px">Estimated 1RM</div>' +
    lineChart(eh.map(x => ({ v: kgOut(x.e1), l: fmtShort(x.date), t: fmtD(x.date) + " — " + wTxt(x.e1) })), { fmt: v => Math.round(v), label: "Estimated one-rep max" }) + "</div>" +
    '<div><div class="eb" style="margin-bottom:7px">Volume per session (' + wU() + ")</div>" +
    barChart(eh.map(x => ({ v: x.vol, c: "var(--out)", t: fmtD(x.date) + " — " + nf(kgOut(x.vol)) + " " + wU() })), { px: 132 }) + "</div></div></div>";

  const prs = trained.map(id => ({ id, n: LIBM[id].n, ...prFor(id) })).filter(x => x.w > 0).sort((a, b) => b.e1 - a.e1);
  if (prs.length) h += '<div class="sh"><h2>Personal records</h2><span class="ti mu">' + prs.length + " lifts</span></div>" +
    '<div class="card s-move"><div class="sx"><table class="dt"><thead><tr><th>Exercise</th><th>Group</th><th>Best set</th><th>Est. 1RM</th><th>Set on</th></tr></thead><tbody>' +
    prs.map(p => '<tr><td><b>' + esc(p.n) + '</b></td><td><span class="chip pl" style="--k-ink:' + MG[LIBM[p.id].m].h + '">' + MG[LIBM[p.id].m].n + "</span></td>" +
      '<td class="mo"><b>' + wTxt(p.w) + "</b> × " + p.r + '</td><td class="mo" style="color:var(--warn)">' + wTxt(p.e1) + '</td><td class="mu">' + (p.date ? fmtShort(p.date) : "—") + "</td></tr>").join("") +
    "</tbody></table></div></div>";
  return h;
}
function nutritionPanel() {
  const { range, days, wk } = progressWindow();
  let h = windowSeg(range);
  if (!S.food.length) return h + '<div class="card"><div class="empty">' + I.food + "<h3>Nothing to chart yet</h3>" +
    '<p class="ti">Log a few days of food and your intake trend fills in here.</p></div></div>';

  h += '<div class="card s-food" style="margin-bottom:13px"><div class="eb" style="margin-bottom:9px">Calorie intake</div>' +
    barChart(days.map(d => { const b = budget(d); return { v: b.eaten, c: b.eaten > b.target ? "var(--crit)" : "var(--in)", o: b.eaten ? 1 : .2, t: fmtD(d) + " — " + nf(b.eaten) }; }),
      { px: 122, label: "Daily calorie intake" }) +
    '<div class="legend" style="margin-top:7px;justify-content:space-between"><span>' + fmtShort(days[0]) + "</span><span>Today</span></div></div>";

  h += '<div class="sh"><h2>Weekly averages</h2></div><div class="card s-food"><div class="sx"><table class="dt"><thead><tr>' +
    "<th>Week</th><th>Avg intake</th><th>Days logged</th></tr></thead><tbody>" +
    wk.slice().reverse().map(w => "<tr><td><b>" + fmtShort(w.start) + '</b></td><td class="mo">' + (w.avgKcal ? nf(w.avgKcal) : "—") +
      '</td><td class="mo mu">' + w.loggedDays + "/7</td></tr>").join("") +
    "</tbody></table></div></div>";

  const logged = days.map(d => budget(d)).filter(b => b.eaten > 0);
  if (logged.length >= 4) {
    const avgIn = logged.reduce((a, b) => a + b.eaten, 0) / logged.length;
    const avgB = logged.reduce((a, b) => a + b.tdee, 0) / logged.length;
    const gap = avgIn - avgB;
    const predicted = gap * 7 / KCAL_PER_KG;
    const actual = weightRate(Math.min(range, 42));
    h += '<div class="sh"><h2>Does the maths match the scale?</h2></div><div class="card s-core">' +
      '<div class="grid g4" style="gap:11px">' +
      miniStat("Avg intake", nf(avgIn), "kcal") + miniStat("Avg need", nf(avgB), "kcal") +
      miniStat("Balance", (gap > 0 ? "+" : "−") + nf(Math.abs(gap)), "kcal/day") +
      miniStat("Predicted", (predicted > 0 ? "+" : "−") + round(kgOut(Math.abs(predicted)), 2), wU() + "/wk") + "</div>" +
      '<p class="ti mu" style="margin:12px 0 0;max-width:76ch">Over ' + logged.length + " logged days you averaged <b>" + nf(avgIn) +
      "</b> kcal against an estimated need of <b>" + nf(avgB) + "</b>, which predicts <b>" +
      (predicted > 0 ? "+" : "−") + round(kgOut(Math.abs(predicted)), 2) + " " + wU() + "</b> a week." +
      (actual != null ? " The scale says <b>" + (actual > 0 ? "+" : "−") + round(kgOut(Math.abs(actual)), 2) + " " + wU() + "</b> a week." +
        (Math.abs(predicted - actual) > 0.25 ? " When those disagree it is usually a gap in the food log or a baseline that differs from the formula — believe the scale and adjust your target." : " Close enough that the estimates are working.")
        : "") + "</p></div>";
  }
  return h;
}
function padelPanel() {
  const { range, wk } = progressWindow();
  let h = windowSeg(range);
  if (!S.padel.length) return h + '<div class="card"><div class="empty">' + I.padel + "<h3>Nothing to chart yet</h3>" +
    '<p class="ti">Log a session or two and your court time fills in here.</p></div></div>';

  h += '<div class="card s-weight" style="margin-bottom:13px"><div class="eb" style="margin-bottom:9px">Hours on court per week</div>' +
    barChart(wk.map(w => ({ v: round(w.padelMin / 60, 1), c: "var(--wt)", o: w.padelMin ? 1 : .2, t: w.label + " — " + round(w.padelMin / 60, 1) + "h" })), { px: 108, label: "Hours on court per week" }) +
    '<div class="legend" style="margin-top:7px;justify-content:space-between"><span>' + fmtShort(wk[0].start) + "</span><span>This week</span></div></div>";

  const decidedWks = wk.filter(w => w.padelW + w.padelL > 0);

        { fmt: v => Math.round(v) + "%", label: "Win rate per week" }) + "</div>";

}
function projText(cur, target, rate) {
  if (cur == null || !target || rate == null || Math.abs(rate) < 0.03) return "";
  const gap = target - cur;
  if (gap * rate <= 0) return " · moving away from it";
  const weeks = Math.abs(gap / rate);
  return weeks > 104 ? "" : " · about " + Math.round(weeks) + " weeks at this pace";
}

function loadSample() {
  if (!confirm("Load one week of invented sample data? This is not real data — it only shows the app populated. Anything you have logged is kept.")) return;
  const R = (a, b) => a + Math.random() * (b - a);
  const base = 78.4;
  for (let i = 13; i >= 0; i--) {
    const d = shift(today(), -i);
    if (!S.weights.some(w => w.date === d) && i % 2 === 0) S.weights.push({ date: d, kg: round(base - (13 - i) * 0.045 + R(-0.45, 0.45), 1) });
    if (!S.food.some(f => f.date === d)) {
      [["breakfast", "oats", 70], ["breakfast", "banana", 1], ["breakfast", "whey", 1],
      ["lunch", "chickenbreast", 180], ["lunch", "rice", 200], ["lunch", "salad", 150], ["lunch", "oliveoil", 1],
      ["dinner", "salmon", 160], ["dinner", "sweetpotato", 220], ["dinner", "broccoli", 150],
      ["snack", "greekyog", 170], ["snack", "almonds", 25]].forEach(([meal, fid, qty]) => {
        const f = FOODM[fid]; if (!f) return;
        const q = qty * R(0.85, 1.15), c = entryKcal(f, q);
        S.food.push({ id: uid(), ts: Date.now() - i * DAY, date: d, meal, foodId: fid, name: f.n, qty: round(q, 1), unit: f.u, kcal: c.kcal, p: c.p, c: c.c, f: c.f });
      });
    }
    const dow = parseISO(d).getDay();
    if ((dow === 1 || dow === 3 || dow === 5) && !S.workouts.some(w => w.date === d)) {
      const plans = [
        { n: "Push", ex: [["bench", 75], ["dbincl", 28], ["dbohp", 22], ["lateral", 11], ["pushdown", 30]] },
        { n: "Pull", ex: [["latpull", 60], ["bbrow", 65], ["seatedrow", 55], ["facepull", 22], ["dbcurl", 14]] },
        { n: "Legs", ex: [["squat", 95], ["rdl", 85], ["legpress", 160], ["legcurl", 45], ["calfraise", 70]] }
      ];
      const pl = plans[dow === 1 ? 0 : dow === 3 ? 1 : 2];
      const mins = Math.round(R(50, 70));
      S.workouts.push({
        id: uid(), date: d, ts: parseISO(d).getTime(), name: pl.n + " day", minutes: mins, notes: "",
        watchKcal: Math.round(R(380, 520)),
        exercises: pl.ex.map(([id, w]) => ({
          exId: id, name: LIBM[id].n, note: "", rest: LIBM[id].rest,
          sets: Array.from({ length: 3 }, (_, k) => ({ w: Math.round(w * (1 - k * 0.03) / 2.5) * 2.5, r: Math.round(R(6, 11)), rpe: Math.round(R(7, 9)), type: "normal", done: true }))
        }))
      });
    }
    if ((dow === 2 || dow === 6) && !S.padel.some(p => p.date === d)) {
      const mins = Math.round(R(60, 120) / 15) * 15;
      pushActivity({
        id: uid(), ts: parseISO(d).getTime(), type: "padel", date: d, startTime: dow === 6 ? "10:00" : "19:30",
        minutes: mins, distance: null, intensity: Math.random() > 0.5 ? "moderate" : "hard", intensitySet: true,
        watchKcal: Math.round(mins * R(8.5, 12)), heartRate: null, notes: "",
        kind: "match", opponent: "", partner: "", sets: [], result: "unset"
      });
    }
  }
  S.profile.done = true; S.demo = true;
  if (!S.profile.targetKg) S.profile.targetKg = 74;
  save(); toast("Sample week loaded — invented data"); go("home");
}

/* ==================================================================
   VISUAL VIEWPORT
   A phone keyboard shrinks the visual viewport but leaves the layout
   viewport (and therefore vh) untouched. Publishing the real numbers
   as CSS variables is what keeps a search sheet above the keyboard
   instead of behind it.
   ================================================================== */
function syncViewport() {
  const vv = window.visualViewport;
  const r = document.documentElement;
  if (!vv) { r.style.setProperty("--vvh", window.innerHeight + "px"); r.style.setProperty("--vvtop", "0px"); return; }
  r.style.setProperty("--vvh", Math.round(vv.height) + "px");
  /* offsetTop is non-zero when the page itself has been scrolled by the browser */
  r.style.setProperty("--vvtop", Math.round(vv.offsetTop) + "px");
  document.body.classList.toggle("kbd", window.innerHeight - vv.height > 120);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncViewport);
  window.visualViewport.addEventListener("scroll", syncViewport);
}
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));
syncViewport();

/* When a field inside a sheet takes focus, make sure it and the first few
   results stay visible rather than sliding under the keyboard. */
document.addEventListener("focusin", e => {
  const f = e.target;
  if (!f || !f.matches || !f.matches("input,textarea,select")) return;
  const sheet = f.closest(".modal");
  if (!sheet) return;
  setTimeout(() => {
    syncViewport();
    const body = sheet.querySelector(".bd");
    if (body && !f.closest(".bd")) body.scrollTop = 0;   /* search field lives above the list */
    else if (f.scrollIntoView) f.scrollIntoView({ block: "nearest" });
  }, 180);
});

function bind() {
  const ln = $("#lname"); if (ln) ln.oninput = e => { S.live.name = e.target.value; save(); };
  const nt = $("#lnotes"); if (nt) nt.oninput = e => { S.live.notes = e.target.value; save(); };
  $$("[data-f]").forEach(inp => inp.oninput = e => {
    const ex = findEx(inp.dataset.ex); if (!ex) return;
    ex.sets[+inp.dataset.i][inp.dataset.f] = e.target.value; save();
  });
  /* the two big number fields in the logger */
  $$("[data-setf]").forEach(inp => {
    inp.oninput = e => {
      const ex = findEx(inp.dataset.ex); if (!ex) return;
      const s = ex.sets[+inp.dataset.i]; if (!s) return;
      s[inp.dataset.setf] = e.target.value; save();
    };
    inp.onfocus = () => inp.select();
  });
  const pg = $("#pgsel"); if (pg) pg.onchange = e => { V.progEx = e.target.value; render(); };
  const pf = $("#photofile");
  if (pf) pf.onchange = e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (V.photoReplaceId) { const rid = V.photoReplaceId; V.photoReplaceId = null; deletePhotoSilently(rid); }
    savePhotoFile(f);
  };
  hydratePhotoThumbs(document);
  if (ROUTE === "settings") refreshFitbitStatus();
}

const payload = () => JSON.stringify({ ...S, exportedAt: new Date().toISOString(), app: "evenkeel" }, null, 1);
function doExport() {
  const b = $("#expbox"); if (!b) return;
  b.hidden = false; b.value = payload(); b.select();
  try { navigator.clipboard.writeText(b.value).then(() => toast("Copied to clipboard"), () => toast("Select the text below and copy it")); }
  catch (err) { toast("Select the text below and copy it"); }
}
async function doExportFile() {
  const data = payload(), name = "evenkeel-" + today() + ".json";
  if (window._dl) {
    try { await window._dl.save({ filename: name, data }); toast("File saved"); }
    catch (err) { toast("Save cancelled — use Copy JSON instead"); }
    return;
  }
  /* self-hosted: an ordinary browser download */
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Download started");
  } catch (err) { doExport(); }
}
function doImport() {
  const b = $("#impbox"); if (!b || !b.value.trim()) { toast("Paste an export first."); return; }
  let p;
  try { p = JSON.parse(b.value); } catch (err) { toast("That is not valid JSON."); return; }
  if (!p || typeof p !== "object" || !Array.isArray(p.food)) { toast("That does not look like an Even Keel export."); return; }
  if (!confirm("Replace everything currently stored with this import?")) return;
  S = Object.assign(DEFAULTS(), p);
  S.profile = Object.assign(DEFAULTS().profile, p.profile || {});
  S.profile.targets = Object.assign(DEFAULTS().profile.targets, (p.profile || {}).targets || {});
  registerCustom(); resetIndex(); save(); applyTheme(); toast("Imported"); go("home");
}

/* ==================================================================
   BOOT
   ================================================================== */
load();
migrate();
registerCustom();
resetIndex();
applyTheme();
render();
handleQuickAdd();
authBoot();
(function handleFitbitRedirect() {
  const p = new URLSearchParams(window.location.search);
  const fb = p.get("fitbit");
  if (!fb) return;
  p.delete("fitbit");
  try { window.history.replaceState({}, "", window.location.pathname + (p.toString() ? "?" + p : "")); } catch (e) { }
  if (fb === "connected") { S.fitbit.connected = true; save(); toast("Fitbit connected — syncing…"); syncFitbitNow(); }
  else if (fb === "denied") toast("Fitbit connection cancelled");
})();
setInterval(() => { const c = $("#lclock"); if (c && S.live) c.textContent = hms((Date.now() - S.live.startedAt) / 1000); }, 1000);

/* ---------- PWA: offline app shell ----------
   Registration only — nothing about your data changes. Everything you
   log already writes straight to localStorage/IndexedDB on this device,
   online or off, so there is no separate "sync" step; this only keeps
   the app itself opening without a connection. */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { try { navigator.serviceWorker.register("/sw.js").catch(() => { }); } catch (e) { } });
}
function updateOfflineBadge() {
  let n = document.getElementById("offlinebadge");
  if (!navigator.onLine) {
    if (!n) {
      n = document.createElement("div");
      n.id = "offlinebadge";
      n.className = "toast";
      n.style.cssText = "left:20px;right:20px;bottom:auto;top:14px;text-align:center;z-index:130";
      n.textContent = "Offline — your data is safe, changes save on this device";
      document.body.appendChild(n);
    }
  } else if (n) { n.remove(); }
}
window.addEventListener("online", updateOfflineBadge);
window.addEventListener("offline", updateOfflineBadge);
updateOfflineBadge();
(async () => {
  const b = () => $("#dlb");
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) { window._dl = dl; if (b()) b().hidden = false; }
    } else if (b()) {
      b().hidden = false;   /* self-hosted — ordinary downloads work */
    }
  } catch (e) { /* Copy JSON still works */ }
})();
</script>
