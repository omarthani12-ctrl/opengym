/* ==================================================================
   PROGRESSION
   XP, levels, streaks, daily quests and badges — all worked out from
   what is already logged, so nothing extra is stored and nothing can
   drift out of sync with the real data.
   ================================================================== */
const XP = { meal: 8, workout: 45, setBonus: 3, padel: 40, weigh: 12, calorieHit: 25, proteinHit: 20, questAll: 40 };

/* level curve: each level costs a bit more than the last */
function xpForLevel(n) { return Math.round(120 * Math.pow(n, 1.45)); }
function levelFromXP(xp) {
  let lv = 1;
  while (lv < 99 && xp >= xpForLevel(lv)) { xp -= xpForLevel(lv); lv++; }
  return { level: lv, into: Math.round(xp), need: xpForLevel(lv) };
}
function dayXP(date) {
  let x = 0;
  const meals = new Set(S.food.filter(f => f.date === date).map(f => f.meal));
  x += meals.size * XP.meal;
  S.workouts.filter(w => w.date === date).forEach(w => { x += XP.workout + workSets(w) * XP.setBonus; });
  x += S.padel.filter(p => p.date === date).length * XP.padel;
  x += S.activities.filter(a => a.type !== "padel" && a.date === date).length * XP.padel;
  if (S.weights.some(w => w.date === date)) x += XP.weigh;
  const b = budget(date);
  if (b.eaten > 0 && Math.abs(b.eaten - b.target) <= b.target * 0.1) x += XP.calorieHit;
  if (b.macros.p.eaten > 0 && b.macros.p.eaten >= b.macros.p.target * 0.9) x += XP.proteinHit;
  return x;
}
function totalXP() {
  if (CACHE.xp != null) return CACHE.xp;
  const dates = new Set([].concat(
    S.food.map(f => f.date), S.workouts.map(w => w.date),
    S.padel.map(p => p.date), S.weights.map(w => w.date)));
  let x = 0;
  dates.forEach(d => { x += dayXP(d); });
  return (CACHE.xp = x);
}
/* days in a row with anything logged at all */
function logStreak() {
  const has = d => S.food.some(f => f.date === d) || S.workouts.some(w => w.date === d) ||
    S.padel.some(p => p.date === d) || S.weights.some(w => w.date === d) || S.activities.some(a => a.date === d);
  let n = 0, i = has(today()) ? 0 : 1;
  if (!has(shift(today(), -i))) return 0;
  while (n < 400 && has(shift(today(), -i))) { n++; i++; }
  return n;
}

/* ---------- today's quests ---------- */
function quests() {
  const b = budget(today());
  const m = b.macros;
  const meals = new Set(S.food.filter(f => f.date === today()).map(f => f.meal));
  const trained = dayLoad(today()) > 0;
  const rec = recommendation();
  const q = [
    { id: "log", n: "Log 3 meals", done: meals.size >= 3, now: meals.size, goal: 3, xp: XP.meal * 3, ic: I.food, k: "g-food" },
    { id: "prot", n: "Hit your protein", done: m.p.eaten >= m.p.target * 0.9, now: Math.round(m.p.eaten), goal: m.p.target, xp: XP.proteinHit, ic: I.gym, k: "g-move" },
    { id: "kcal", n: "Land near your calories", done: b.eaten > 0 && Math.abs(b.eaten - b.target) <= b.target * 0.1, now: Math.round(b.eaten), goal: b.target, xp: XP.calorieHit, ic: I.fire, k: "g-cal" },
    { id: "weigh", n: "Step on the scale", done: S.weights.some(w => w.date === today()), now: 0, goal: 1, xp: XP.weigh, ic: I.weight, k: "g-weight" }
  ];
  q.push(rec.verdict === "REST"
    ? { id: "rest", n: "Take the rest day", done: !trained, now: 0, goal: 1, xp: 30, ic: I.moon, k: "g-rest" }
    : { id: "move", n: "Train today", done: trained, now: 0, goal: 1, xp: XP.workout, ic: I.gym, k: "g-move" });
  return q;
}

/* ---------- badges ---------- */
function badges() {
  const w = S.workouts.length, p = S.padel.length;
  const padelHrs = S.padel.reduce((a, x) => a + x.minutes, 0) / 60;
  const meals = S.food.length;
  const st = logStreak();
  const vol = S.workouts.reduce((a, x) => a + workVolume(x), 0);
  const list = [
    { n: "First rep", d: "Log a workout", got: w >= 1, ic: "🏋️" },
    { n: "Regular", d: "10 workouts", got: w >= 10, ic: "💪" },
    { n: "Committed", d: "50 workouts", got: w >= 50, ic: "🔩" },
    { n: "On court", d: "Log a padel session", got: p >= 1, ic: "🎾" },
    { n: "Court rat", d: "25 hours of padel", got: padelHrs >= 25, ic: "🔥" },
    { n: "Tracking", d: "Log 100 foods", got: meals >= 100, ic: "🍎" },
    { n: "Week one", d: "7-day streak", got: st >= 7, ic: "⚡" },
    { n: "Unbroken", d: "30-day streak", got: st >= 30, ic: "🏆" },
    { n: "Heavy", d: "Move 100,000 kg total", got: vol >= 100000, ic: "🗿" },
    { n: "Weighed in", d: "20 weigh-ins", got: S.weights.length >= 20, ic: "⚖️" }
  ];
  return { list, got: list.filter(x => x.got).length };
}

/* ---------- the header card ---------- */
function levelCard() {
  const xp = totalXP();
  const lv = levelFromXP(xp);
  const pct = clamp(lv.into / lv.need * 100, 0, 100);
  const st = logStreak();
  const today_xp = dayXP(today());
  const b = badges();
  return '<div class="hero">' +
    '<div class="hero-top">' +
    '<div class="lvl"><span class="lvl-n">' + lv.level + "</span><span class=\"lvl-l\">LEVEL</span></div>" +
    '<div style="flex:1;min-width:0">' +
    '<div class="hero-name">' + esc(levelTitle(lv.level)) + "</div>" +
    '<div class="xpbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="xp-meta"><span>' + nf(lv.into) + " / " + nf(lv.need) + " XP</span>" +
    (today_xp ? "<span>+" + nf(today_xp) + " today</span>" : "<span>log something to earn XP</span>") + "</div></div></div>" +
    '<div class="hero-stats">' +
    '<div class="hs"><span class="hs-n">' + st + '</span><span class="hs-l">' + (st === 1 ? "day" : "days") + " streak</span></div>" +
    '<div class="hs"><span class="hs-n">' + nf(xp) + '</span><span class="hs-l">total XP</span></div>' +
    '<div class="hs"><span class="hs-n">' + b.got + "/" + b.list.length + '</span><span class="hs-l">badges</span></div>' +
    "</div></div>";
}
function levelTitle(lv) {
  const t = ["Getting started", "Warming up", "Finding rhythm", "Consistent", "Dialled in",
    "Strong week", "Machine", "Relentless", "Formidable", "Unstoppable"];
  return t[Math.min(t.length - 1, Math.floor((lv - 1) / 3))];
}

/* ---------- macro rows: target / consumed / remaining (used on the Food page) ---------- */
function macroRow(name, scope, eaten, target, unit) {
  const pct = target > 0 ? clamp(eaten / target * 100, 0, 100) : 0;
  const over = target > 0 && eaten > target;
  const left = target - eaten;
  return '<div class="mrow ' + scope + '"><div class="top"><span class="nm">' + esc(name) + "</span>" +
    '<span class="vals"><b>' + nf(eaten) + "</b><span> / " + nf(target) + " " + unit + "</span></span></div>" +
    '<div class="bar"><i class="' + (over ? "over" : "") + '" style="width:' + pct + '%"></i></div>' +
    '<div class="rem"><span>' + (over ? "over by" : "remaining") + " <b>" + nf(Math.abs(left)) + " " + unit + "</b></span>" +
    "<span>" + Math.round(target > 0 ? eaten / target * 100 : 0) + "%</span></div></div>";
}
function macroBlock(b) {
  const m = b.macros;
  return '<div class="mgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    macroRow("Calories", "s-core wide", b.eaten, b.target, "kcal") +
    macroRow("Protein", "s-move", m.p.eaten, m.p.target, "g") +
    macroRow("Carbs", "s-food", m.c.eaten, m.c.target, "g") +
    macroRow("Fat", "s-weight", m.f.eaten, m.f.target, "g") + "</div>";
}

  h += '<div class="verdict ' + rec.cls + '" style="margin-top:0"><div class="btw wr" style="align-items:flex-start;gap:14px">' +
    '<div style="min-width:0"><div class="vt">' + rec.verdict + "</div>" +
    '<p style="margin:7px 0 0;font-size:14.5px;font-weight:600;max-width:52ch">' + esc(rec.headline) + "</p></div>" +
    '<div style="text-align:right;flex:none"><div class="eb">Load</div>' +
    '<div class="bignum" style="font-size:26px;color:var(--k-ink)">' + rec.fatigue + "</div></div></div>" +
    (rec.recap ? '<p style="margin:10px 0 0;font-size:13px;font-weight:600;color:var(--k-ink)">' + esc(rec.recap) + "</p>" : "") +
    '<details style="margin-top:9px"><summary class="ti mu" style="cursor:pointer;font-weight:650">Why?</summary>' +
    "<ul>" + rec.why.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" +
    '<p class="disc">General fitness guidance from what you have logged — not medical advice.</p></details></div></div>';

  /* ---- today's activity, only if there is any ---- */
  const a = b.activity;
  if (a.items.length) {
    h += '<div class="sect"><div class="sect-hd"><h2>Today\'s activity</h2><span class="ti mu">' + nf(a.total) + " kcal</span></div>";
    h += activityCard(today(), true) + "</div>";

  h += '<div class="row" style="gap:8px;margin-top:14px">' +
    '<button class="btn gh" style="flex:1" data-a="openinsights">' + I.brain + "AI insights</button>" +
    '<button class="btn gh" style="flex:1" data-a="openweekly">' + I.flag + "Weekly report</button></div>";

  return h;
}

/* ---- the three numbers worth checking at a glance: fitness, recovery, calories ---- */
function bigThreeHero(b) {
  const fs = fitnessScore("daily");
  const rec = recoveryScore();
  const calPct = b.target > 0 ? clamp(Math.round(b.eaten / b.target * 100), 0, 100) : 0;
  const calColor = b.eaten > b.target ? "var(--crit)" : b.eaten === 0 ? "var(--text-3)" : "var(--in)";
  return '<div class="bigthree">' +
    '<button data-a="scoredetail"><div class="bt-ring" style="background:conic-gradient(' + (fs.score != null ? scoreColor(fs.score) : "var(--surface-3)") + " calc(" + (fs.score || 0) + "*1%), var(--surface-3) 0)\"><b>" + (fs.score != null ? fs.score : "—") + "</b></div>" +
    '<span class="bt-label">Fitness</span></button>' +

    '<span class="bt-label">Recovery</span></button>' +

/* ---- the dominant state: a workout is already happening ---- */

  const L = S.live;
  const idx = wkIndex();
  const e = L.exercises[idx];
  const si = activeSetIndex(e);
  const setLabel = si > -1 ? "Set " + (si + 1) + "/" + e.sets.length : "All sets done";
  return '<button class="resume-hero" data-a="go" data-r="gym">' +
    '<div class="rh-top"><span class="rh-dot"></span>Workout in progress · ' + hms((Date.now() - L.startedAt) / 1000) + "</div>" +
    '<div class="rh-name">' + esc(e.name) + "</div>" +
    '<div class="rh-meta">' + esc(setLabel) + " · " + esc(L.name) + "</div>" +
    '<span class="rh-cta">' + I.play + "Resume workout</span></button>";
}

/* ==================================================================
   FITNESS SCORE
   Every sub-score is computed from data that is actually logged, and
   only included if that data exists — an untracked category is left
   out of the average rather than silently scored as 0 or 100. The
   overall score is the plain average of whichever sub-scores apply.

   Recovery reuses recommendation().fatigue — the same load/nutrition/
   weight-trend signal already driving "should you train today" — so
   the score is never a second, disconnected opinion about your data.
   ================================================================== */
function nutritionScore(days) {
  const scores = [];
  days.forEach(d => {
    const b = budget(d);
    if (b.eaten <= 0) return;
    const calS = clamp(100 - Math.abs(b.eaten - b.target) / b.target * 200, 0, 100);
    const parts = [calS];
    if (b.macros.p.target > 0) parts.push(clamp(b.macros.p.eaten / b.macros.p.target * 100, 0, 100));
    scores.push(parts.reduce((a, x) => a + x, 0) / parts.length);
  });
  return scores.length ? Math.round(scores.reduce((a, x) => a + x, 0) / scores.length) : null;
}
function trainingScore(days) {
  if (!S.workouts.length) return null;
  const n = days.filter(d => S.workouts.some(w => w.date === d)).length;
  /* 3-5 sessions/week is a broadly reasonable strength-training frequency,
     not a medical prescription — scaled so 4 in the window scores 100 */
  const target = Math.max(1, Math.round(days.length / 7 * 4));
  return clamp(Math.round(n / target * 100), 0, 100);
}
function cardioScore(days) {
  const cardio = S.activities.filter(a => days.includes(a.date));
  if (!S.activities.length) return null;
  const minutes = cardio.reduce((a, x) => a + x.minutes, 0);
  /* WHO's 150 min/week moderate-activity guideline, scaled to the window */
  const target = days.length / 7 * 150;
  return clamp(Math.round(minutes / target * 100), 0, 100);
}
function hydrationScore(days) {
  const logged = days.filter(d => S.hydration[d] != null);
  if (!logged.length) return null;
  const avg = logged.reduce((a, d) => a + Math.min(1, S.hydration[d] / S.goals.waterTargetMl), 0) / logged.length;
  return Math.round(avg * 100);
}
/* named distinctly from 65-fitbit.js's recoveryScore() (the real, Fitbit-aware,
   single-day one behind the dedicated Recovery card) — this is just the crude,
   always-available, dayLoad()-based fallback that feeds the Fitness Score's
   own Recovery slice, which needs a figure for arbitrary date windows. */
function recoveryComponentScore(days) {
  if (!historyDays()) return null;
  /* recommendation() only evaluates "today" by design (it drives the live verdict card) —
     for other dates in the window we fall back to a lighter proxy built from the same
     dayLoad() signal: a healthy mix of trained and rest days. */
  const rest = days.filter(d => dayLoad(d) === 0).length;
  const restRatio = rest / days.length;
  const today7 = recommendation().fatigue;
  const proxy = clamp(100 - today7 * 0.6 - Math.abs(restRatio - 2 / 7) * 40, 0, 100);
  return Math.round(proxy);
}
function fitnessScore(mode, endDate) {
  mode = mode || "daily";
  endDate = endDate || today();
  const n = mode === "weekly" ? 7 : 1;
  const days = Array.from({ length: n }, (_, i) => shift(endDate, -i));
  const parts = {
    Nutrition: nutritionScore(days),
    Training: trainingScore(days),
    Cardio: cardioScore(days),
    Hydration: hydrationScore(days),
    Recovery: recoveryComponentScore(days)
  };
  const have = Object.keys(parts).filter(k => parts[k] != null);
  const score = have.length ? Math.round(have.reduce((a, k) => a + parts[k], 0) / have.length) : null;
  return { score, parts, have };
}
function scoreColor(v) {
  return v >= 80 ? "var(--good)" : v >= 55 ? "var(--warn)" : "var(--crit)";
}
function fitnessScoreCard() {

/* ==================================================================
   PERSONAL RECORDS
   Nothing here is stored separately — every record and its timeline is
   computed fresh from S.workouts / S.activities / S.steps, so it can
   never drift from the sessions it's built from.
   ================================================================== */
function strengthRecords() {
  const trained = [...new Set(S.workouts.flatMap(w => (w.exercises || []).map(e => e.exId)))].filter(id => LIBM[id]);
  return trained.map(id => ({ id, n: LIBM[id].n, ...prFor(id) })).filter(x => x.w > 0).sort((a, b) => b.e1 - a.e1);
}
/* every point in an exercise's history where its est. 1RM beat the previous best */
function strengthTimeline(exId) {
  const hist = exHistory(exId);
  let best = 0;
  const out = [];
  hist.forEach(h => { if (h.e1 > best) { out.push({ date: h.date, w: h.top, e1: h.e1 }); best = h.e1; } });
  return out.reverse();
}
function cardioRecords() {
  const byType = {};
  S.activities.forEach(a => { (byType[a.type] = byType[a.type] || []).push(a); });
  const recs = [];
  Object.keys(byType).forEach(type => {
    const list = byType[type];
    const meta = ACTIVITY_TYPES[type] || ACTIVITY_TYPES.other;
    const longest = list.slice().sort((a, b) => b.minutes - a.minutes)[0];
    if (longest) recs.push({ n: "Longest " + meta.n.toLowerCase() + " session", v: durT(longest.minutes), date: longest.date });
    const withDist = list.filter(a => a.distance > 0);
    if (withDist.length) {
      const farthest = withDist.slice().sort((a, b) => b.distance - a.distance)[0];
      recs.push({ n: "Longest " + meta.n.toLowerCase() + " distance", v: farthest.distance + " km", date: farthest.date });
      if (type === "running") {
        const fiveKs = withDist.filter(a => a.distance >= 4.8 && a.distance <= 5.2 && a.minutes > 0);
        if (fiveKs.length) {
          const fastest = fiveKs.slice().sort((a, b) => (a.minutes / a.distance) - (b.minutes / b.distance))[0];
          recs.push({ n: "Fastest 5K", v: hms(fastest.minutes * 60) + " (" + round(fastest.minutes / fastest.distance, 1) + " min/km)", date: fastest.date });
        }
      }
    }
  });
  return recs;
}
function activityRecords() {
  const recs = [];
  const stepDates = Object.keys(S.steps);
  if (stepDates.length) {
    const best = stepDates.reduce((a, d) => S.steps[d] > (S.steps[a] || 0) ? d : a, stepDates[0]);
    recs.push({ n: "Most steps in a day", v: nf(S.steps[best]), date: best });
  }
  if (S.workouts.length) {
    const longest = S.workouts.slice().sort((a, b) => b.minutes - a.minutes)[0];
    recs.push({ n: "Longest gym workout", v: durT(longest.minutes), date: longest.date });
  }
  /* most active day: gym + every activity type's minutes, summed per date */
  const totals = {};
  S.workouts.forEach(w => { totals[w.date] = (totals[w.date] || 0) + w.minutes; });
  S.activities.forEach(a => { totals[a.date] = (totals[a.date] || 0) + a.minutes; });
  const dates = Object.keys(totals);
  if (dates.length) {
    const best = dates.reduce((a, d) => totals[d] > totals[a] ? d : a, dates[0]);
    recs.push({ n: "Most active day", v: durT(totals[best]), date: best });
  }
  return recs;
}

    const evalFor = {
      logfood: d => S.food.some(f => f.date === d),
      protein: d => GOAL_DEFS.protein.eval(d),
      steps10k: d => (S.steps[d] || 0) >= 10000
    }[c.metric] || (() => false);
    const hit = days.filter(evalFor).length;
    return { now: hit, target: c.target, unit: "days", pct: clamp(hit / c.target * 100, 0, 100), done: hit >= c.target };
  }
  if (c.type === "goal") {
    let now = 0;
    if (c.metric === "cardio_km") now = round(S.activities.filter(a => days.includes(a.date)).reduce((a, x) => a + (x.distance || 0), 0), 1);
    else if (c.metric === "workouts_count") now = S.workouts.filter(w => days.includes(w.date)).length;
    else if (c.metric === "weight_loss_kg") {
      const start = trendOn(c.startDate), cur = currentWeight();
      now = start != null && cur != null ? round(Math.max(0, start - cur), 1) : 0;
    }
    return { now, target: c.target, unit: c.metric === "cardio_km" ? "km" : c.metric === "workouts_count" ? "workouts" : "kg", pct: clamp(now / c.target * 100, 0, 100), done: now >= c.target };
  }
  if (c.type === "pr") {
    if (c.metric === "5k") {
      const runs = S.activities.filter(a => a.type === "running" && a.distance >= 4.8 && a.distance <= 5.2 && a.minutes > 0 && a.date >= c.startDate);
      const best = runs.length ? Math.min(...runs.map(a => a.minutes / a.distance)) : null;
      const beat = c.baseline != null && best != null && best < c.baseline;
      return { now: best != null ? round(best, 1) + " min/km" : "no 5K yet", target: c.baseline != null ? round(c.baseline, 1) + " min/km" : "—", unit: "", pct: beat ? 100 : 0, done: beat };
    }
    if (c.metric === "steps") {
      const bestSince = Object.keys(S.steps).filter(d => d >= c.startDate).reduce((a, d) => Math.max(a, S.steps[d]), 0);
      const beat = c.baseline != null && bestSince > c.baseline;
      return { now: nf(bestSince), target: nf(c.baseline || 0), unit: "steps", pct: beat ? 100 : 0, done: beat };
    }
    if ((c.metric || "").startsWith("exercise:")) {
      const exId = c.metric.slice(9);
      const pr = prFor(exId);
      const beat = c.baseline != null && pr.e1 > c.baseline;
      return { now: pr.e1 ? wTxt(pr.e1) : "—", target: c.baseline ? wTxt(c.baseline) : "—", unit: "est. 1RM", pct: beat ? 100 : 0, done: beat };
    }
  }
  if (c.type === "custom") {
    /* no auto-trackable metric for a free-text goal — the user updates their own count */
    const now = c.now || 0;
    return { now, target: c.target, unit: "", pct: clamp(now / c.target * 100, 0, 100), done: now >= c.target };
  }
  return { now: 0, target: 1, unit: "", pct: 0, done: false };
}
function bumpCustomChallenge(id, v) {

  c.now = Math.max(0, (c.now || 0) + v);

function foodDate() { V.fdate = V.fdate || today(); return V.fdate; }
function entriesFor(date, meal) { return S.food.filter(f => f.date === date && f.meal === meal); }
function entryKcal(food, qty) {
  const mult = qty / food.per;
  return { kcal: Math.round(food.k * mult), p: round(food.p * mult, 1), c: round(food.c * mult, 1), f: round(food.f * mult, 1) };
}
function qtyLabel(e) {
  if (e.custom) return "quick add";
  return e.unit === "ea" ? round(e.qty, 2) + "×" : round(e.qty, 0) + " " + e.unit;
}

  /* weekly rollup table */

      "<th>Week of</th><th>Days logged</th><th>Avg intake</th><th>Avg target</th><th>Balance</th></tr></thead><tbody>" +
      wk.map(w => {

      }).join("") + "</tbody></table></div></div>";
  }
  return h;
}

/* ---------- recent / frequent ---------- */
function recentFoods(n) {
  const seen = [], out = [];
  S.food.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)).forEach(e => {
    if (!e.foodId || seen.includes(e.foodId)) return;
    seen.push(e.foodId);
    if (FOODM[e.foodId]) out.push({ food: FOODM[e.foodId], qty: e.qty });
  });
  return out.slice(0, n || 8);
}
function frequentFoods(n) {
  const c = {};
  S.food.forEach(e => { if (e.foodId) c[e.foodId] = (c[e.foodId] || 0) + 1; });
  return Object.keys(c).filter(k => FOODM[k]).sort((a, b) => c[b] - c[a]).slice(0, n || 6).map(k => ({ food: FOODM[k], n: c[k] }));
}

const NL_EXAMPLES = ["200g chicken with 150g rice", "2 eggs and 2 slices of toast",

function sheetTabs() {

function drawSay() {
  P.tab = "say";
  const body = sheetTabs() +
    '<div class="nlbox s-food"><label class="eb" style="display:block;margin-bottom:6px">What did you eat?</label>' +

function runParse() {
  const txt = (($("#nlin") || {}).value || P.nl || "").trim();
  if (!txt) { toast("Describe what you ate first."); return; }
  P.nl = txt;
  const res = parseFood(txt);
  if (!res.rows.length) { toast("Nothing recognisable in that — try naming the food plainly."); return; }
  P.rows = res.rows.map(r => r.ok ? {
    ok: true, foodId: r.food.id, name: r.name, qty: r.qty, unit: r.food.u,
    kcal: r.kcal, p: r.p, c: r.c, f: r.f, assumed: r.assumed, ambiguous: r.ambiguous,
    alternatives: r.alternatives, raw: r.raw
  } : { ok: false, raw: r.raw, candidates: r.candidates, reason: r.reason });
  drawReview();
}
function recalcRow(i) {
  const r = P.rows[i]; if (!r || !r.ok) return;
  const f = FOODM[r.foodId]; if (!f) return;
  const c = entryKcal(f, r.qty);
  r.kcal = c.kcal; r.p = c.p; r.c = c.c; r.f = c.f;
}
function drawReview() {
  const rows = P.rows || [];
  const good = rows.filter(r => r.ok);
  const tot = good.reduce((a, r) => ({ k: a.k + r.kcal, p: a.p + r.p, c: a.c + r.c, f: a.f + r.f }), { k: 0, p: 0, c: 0, f: 0 });
  let body = '<p class="ti mu" style="margin:0 0 12px">Read from “<b>' + esc(P.nl) + '</b>”. Change anything before you save it.</p>';
  body += rows.map((r, i) => {
    if (!r.ok) {
      return '<div class="pline warn"><div class="hd2"><span class="chip s-warn">Not recognised</span>' +
        '<b style="flex:1">' + esc(r.raw) + "</b>" +
        '<button class="btn xs gh" data-a="rvdel" data-i="' + i + '" aria-label="Remove">' + I.x + "</button></div>" +
        '<p class="ti mu" style="margin:0 0 8px">' + (r.candidates && r.candidates.length
          ? "Did you mean one of these?" : "No match in the food table. Search for it, or log the calories yourself.") + "</p>" +
        (r.candidates && r.candidates.length ? '<div class="hint" style="margin:0 0 8px">' + r.candidates.map(c =>

/* ==================================================================
   MEAL SUGGESTIONS
   Combinations of real foods from the existing database, scaled to fit
   whatever calories/macros are actually left today — never an invented
   food or a made-up nutrition figure. Each ingredient's numbers come
   from the same entryKcal() every other part of the app uses.
   ================================================================== */
const MEAL_TEMPLATES = [
  { n: "Chicken rice bowl", items: [["chickenbreast", 180], ["rice", 200], ["broccoli", 100], ["oliveoil", 1]], tags: ["highprotein"] },
  { n: "Greek yogurt, cereal & berries", items: [["greekyog", 200], ["cereal", 40], ["blueberry", 80]], tags: ["quick", "nocook", "vegetarian"] },
  { n: "Beef & potatoes", items: [["beefmince", 150], ["potato", 250], ["salad", 100]], tags: ["highprotein"] },
  { n: "Salmon, quinoa & greens", items: [["salmon", 150], ["quinoa", 150], ["spinach", 80]], tags: ["highprotein"] },
  { n: "Eggs on toast", items: [["egg", 2], ["wholewheat", 2], ["avocado", 50]], tags: ["quick", "vegetarian"] },
  { n: "Tuna, rice & salad", items: [["tuna", 120], ["rice", 180], ["salad", 120], ["oliveoil", 1]], tags: ["highprotein", "lowfat", "quick"] },
  { n: "Cottage cheese & fruit", items: [["cottage", 200], ["apple", 1], ["almonds", 15]], tags: ["quick", "nocook", "vegetarian", "lowcal"] },
  { n: "Chickpea & veg bowl", items: [["chickpeas", 200], ["rice", 150], ["pepper", 80], ["tahini", 15]], tags: ["vegetarian", "cheap"] },
  { n: "Turkey wrap", items: [["turkey", 150], ["wrap", 1], ["lettuce", 30], ["hummus", 20]], tags: ["quick", "cheap"] },
  { n: "Protein shake & banana", items: [["whey", 1], ["milk", 250], ["banana", 1], ["peanutbutter", 15]], tags: ["quick", "nocook", "highprotein"] },
  { n: "Omelette & sweet potato", items: [["omelette", 1], ["sweetpotato", 200]], tags: ["vegetarian"] },
  { n: "Falafel plate", items: [["falafel", 6], ["hummus", 40], ["salad", 120], ["pita", 1]], tags: ["vegetarian", "cheap"] }
];
const SUGGEST_FILTERS = {
  highprotein: "High protein", lowfat: "Low fat", lowcal: "Low calorie", quick: "Quick",
  cheap: "Cheap", nocook: "No cooking", vegetarian: "Vegetarian"
};
function scaledMeal(tpl, targetKcal) {
  let total = 0;
  const rows = tpl.items.map(([id, qty]) => { const f = FOODM[id]; if (!f) return null; const c = entryKcal(f, qty); total += c.kcal; return { id, f, qty, c }; }).filter(Boolean);
  if (!total) return null;
  const scale = targetKcal > 0 ? clamp(targetKcal / total, 0.5, 1.8) : 1;
  const sums = { kcal: 0, p: 0, c: 0, f: 0 };
  const scaledItems = rows.map(r => {
    const q = round(r.qty * scale, r.f.u === "ea" ? 1 : 0);
    const c = entryKcal(r.f, q);
    sums.kcal += c.kcal; sums.p += c.p; sums.c += c.c; sums.f += c.f;
    return { id: r.id, name: r.f.n, qty: q, unit: r.f.u };
  });
  return { name: tpl.n, tags: tpl.tags, items: scaledItems, sums, distance: null };
}
function mealSuggestions(filters) {
  const b = budget(today());
  const remKcal = Math.max(0, b.target - b.eaten);
  const remP = Math.max(0, b.macros.p.target - b.macros.p.eaten);
  const remC = Math.max(0, b.macros.c.target - b.macros.c.eaten);
  const remF = Math.max(0, b.macros.f.target - b.macros.f.eaten);
  let pool = MEAL_TEMPLATES;
  if (filters && filters.length) pool = pool.filter(t => filters.every(f => t.tags.includes(f)));
  const scored = pool.map(t => {
    const m = scaledMeal(t, remKcal);
    if (!m) return null;
    /* how well this fits what's actually left — smaller is better */
    const kcalErr = Math.abs(m.sums.kcal - remKcal) / Math.max(remKcal, 1);
    const pErr = remP > 0 ? Math.abs(m.sums.p - remP) / remP : 0;
    m.distance = kcalErr * 0.5 + pErr * 0.5;

function foodIndex() {

    const t = tok(f.n).filter(w => !NOISE.includes(w) && w.length > 1);
    return { f, toks: t, phrase: t.join(" ") };

function scoreFood(qToks, entry) {
  if (!qToks.length) return 0;

  let hit = 0;
  q.forEach(w => {
    if (e.includes(w)) hit += 1;
    else if (e.some(x => x.length > 3 && (x.startsWith(w) || w.startsWith(x)))) hit += 0.72;
  });
  const cover = hit / q.length;              /* how much of what you typed matched */
  const spec = hit / Math.max(1, e.length);  /* how much of the food name was used */
  let s = cover * 0.62 + spec * 0.38;
  if (entry.phrase === q.join(" ")) s += 0.45;
  else if (entry.phrase.indexOf(q.join(" ")) === 0) s += 0.14;

function matchFood(phrase) {

  if (!raw) return { best: null, list: [] };
  /* exact synonym first — beats any fuzzy score */
  if (SYN[raw] && FOODM[SYN[raw]]) return { best: { f: FOODM[SYN[raw]], s: 1.3 }, list: [] };
  const words = tok(raw);
  const clean = words.filter(w => !NOISE.includes(w) && !SIZE[w] && !NUMW[w]);
  /* synonym on the cleaned phrase, then on any 2-word window, then single words */
  const cl = clean.join(" ");
  if (SYN[cl] && FOODM[SYN[cl]]) return { best: { f: FOODM[SYN[cl]], s: 1.25 }, list: [] };
  for (let i = 0; i < clean.length - 1; i++) {
    const w2 = clean[i] + " " + clean[i + 1];
    if (SYN[w2] && FOODM[SYN[w2]]) return { best: { f: FOODM[SYN[w2]], s: 1.15 }, list: [] };
  }
  if (!clean.length) return { best: null, list: [] };
  const ranked = foodIndex().map(e => ({ f: e.f, s: scoreFood(clean, e) }))
    .filter(x => x.s > 0.15).sort((a, b) => b.s - a.s).slice(0, 5);

     what you typed. "rice" alone is rice; "cream of rice elev8" is a branded

  for (const w of clean) {
    if (SYN[w] && FOODM[SYN[w]]) {
      const f = FOODM[SYN[w]];
      const s = 0.34 + (1 / clean.length) * 0.72;

  let m = s.match(/^(\d+(?:\.\d+)?|\d+\s*\/\s*\d+|[a-z]+)\s*([a-z]+)?\b\s*(.*)$/);

    let n = null;
    if (/^\d/.test(m[1])) n = m[1].indexOf("/") > -1 ? (parseFloat(m[1].split("/")[0]) / parseFloat(m[1].split("/")[1])) : parseFloat(m[1]);
    else if (NUMW[m[1]] != null) n = NUMW[m[1]];
    if (n != null) {
      qty = n;
      if (m[2] && UNITS[m[2]]) { unit = m[2]; s = m[3]; }
      else { s = ((m[2] || "") + " " + (m[3] || "")).trim(); }

    m = s.match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*([a-z]+)?$/);

  }

    alternatives: mm.list.slice(0, 4).map(x => x.f).filter(x => x.id !== f.id),

/* Same normalisation as norm() but commas survive, because they are one of

function normKeepCommas(s) {

   explicit amounts add together. */

  const out = [];
  rows.forEach(r => {
    if (!r.ok) { out.push(r); return; }
    const prev = out.find(x => x.ok && x.food && r.food && x.food.id === r.food.id);
    if (!prev) { out.push(r); return; }
    if (prev.assumed && !r.assumed) { prev.qty = r.qty; prev.assumed = false; }
    else if (!prev.assumed && !r.assumed) { prev.qty = round(prev.qty + r.qty, 2); }

/* ---------------- barcode ---------------- */
function barcodeBody() {
  const s = scanSupport();
  if (!s.ok) {
    return '<div class="empty" style="padding:20px">' + I.cam + "<h3>Not available here</h3>" +
      '<p class="ti" style="max-width:44ch;margin:0 auto">' + esc(scanBlockedReason()) + "</p></div>";
  }
  return '<div class="scan" id="scanbox"><video id="scanvid" playsinline muted></video>' +
    '<div class="frame"></div><div class="laser"></div>' +
    '<div class="msg" id="scanmsg">Point the camera at the barcode</div></div>' +
    '<p class="ti mu" style="margin:11px 0 0">Product data comes from Open Food Facts, a public database. Not everything is in it — if nothing is found you can type the label in instead.</p>';

async function startBarcodeCamera() {
  try {
    scanState.detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
    scanState.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    const v = $("#scanvid");
    if (!v) { closeScanner(); return; }
    v.srcObject = scanState.stream;
    await v.play();
    scanLoop();
  } catch (err) {
    const m = $("#scanmsg");
    if (m) m.textContent = err && err.name === "NotAllowedError"
      ? "Camera permission was refused — allow it and try again"
      : "Could not start the camera";
  }
}
function scanLoop() {
  const v = $("#scanvid");
  if (!v || !scanState.detector) return;
  const step = async () => {
    if (!scanState.detector || !$("#scanvid")) return;
    if (!scanState.busy) {
      scanState.busy = true;
      try {
        const codes = await scanState.detector.detect(v);
        if (codes && codes.length && codes[0].rawValue) {
          const code = codes[0].rawValue;
          closeScanner(true);
          lookupBarcode(code);
          return;
        }
      } catch (e) { /* a frame failed to decode — keep going */ }
      scanState.busy = false;
    }
    scanState.raf = requestAnimationFrame(step);
  };
  scanState.raf = requestAnimationFrame(step);
}
function closeScanner(keepModal) {
  if (scanState.raf) cancelAnimationFrame(scanState.raf);
  if (scanState.stream) scanState.stream.getTracks().forEach(t => t.stop());
  scanState = { stream: null, raf: null, detector: null, busy: false };
  if (!keepModal) closeModal();
}

/* ---------- look the code up ---------- */
async function lookupBarcode(code) {
  modal({
    title: "Looking it up", cls: "s-food",
    body: '<div class="empty" style="padding:26px">' + I.search + "<h3>Searching…</h3>" +
      '<p class="ti bcode">' + esc(code) + "</p></div>",
    footer: '<button class="btn gh" data-a="close">Cancel</button>'
  });
  try {
    const r = await fetch(OFF_URL + encodeURIComponent(code) + ".json?fields=product_name,brands,serving_size,nutriments,image_small_url");
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) { barcodeMiss(code); return; }
    const p = j.product, n = p.nutriments || {};
    const kcal = n["energy-kcal_100g"] != null ? +n["energy-kcal_100g"]
      : (n.energy_100g != null ? +n.energy_100g / 4.184 : null);
    if (kcal == null) { barcodeMiss(code, p.product_name); return; }
    const food = {
      id: "bc_" + code, n: [p.brands ? String(p.brands).split(",")[0].trim() : "", p.product_name || "Scanned product"].filter(Boolean).join(" — "),
      cat: "Custom", u: "g", per: 100, k: Math.round(kcal),
      p: round(+n.proteins_100g || 0, 1), c: round(+n.carbohydrates_100g || 0, 1), f: round(+n.fat_100g || 0, 1),
      d: parseServing(p.serving_size) || 100, barcode: code
    };
    /* keep it so the same product is one tap next time, offline */
    S.customFoods = S.customFoods || [];
    if (!S.customFoods.some(x => x.id === food.id)) { S.customFoods.push(food); FOODS.push(food); FOODM[food.id] = food; resetIndex(); save(); }
    else { FOODM[food.id] = food; }
    P.food = food; P.qty = food.d;
    drawQty();
    toast("Found: " + food.n);
  } catch (e) {
    barcodeMiss(code, null, true);
  }
}
function parseServing(s) {
  if (!s) return null;
  const m = String(s).match(/([\d.]+)\s*(g|ml)/i);
  return m ? Math.round(parseFloat(m[1])) : null;
}
function barcodeMiss(code, name, networkFailed) {
  V.pendingBarcode = code;
  modal({
    title: "Not found", cls: "s-food",
    body: '<div class="empty" style="padding:20px">' + I.search +
      "<h3>" + (networkFailed ? "Could not reach the database" : "No match for that barcode") + "</h3>" +
      '<p class="ti bcode" style="margin-bottom:8px">' + esc(code) + "</p>" +
      '<p class="ti" style="max-width:44ch;margin:0 auto">' + (networkFailed
        ? "The lookup request did not go through. Type the label in and it is saved for next time."
        : "Open Food Facts does not have this product. Type what is on the back of the packet and the app will remember it.") + "</p></div>",
    footer: '<button class="btn gh" data-a="close">Close</button>' +
      '<button class="btn pri s-food" data-a="foodmanual">' + I.pen + "Enter from the label</button>"
  });
}

/* ==================================================================
   NUTRITION LABEL OCR
   A single still photo, captured through the OS camera picker rather
   than a live video stream — simpler, works on any device, and Tesseract
   only ever needed one frame anyway. Every field is regex-parsed with a
   confidence score; nothing with a shaky read is presented as certain.
   ================================================================== */
let TESS = null;      /* the loaded Tesseract.js module, cached after first use */
function labelBody() {
  const s = ocrSupport();
  if (!s.ok) {
    return '<div class="empty" style="padding:20px">' + I.cam + "<h3>Not available here</h3>" +
      '<p class="ti" style="max-width:44ch;margin:0 auto">Reading a label needs a small OCR library loaded from the network, which this preview blocks. It works on your own hosted copy of the app.</p></div>';
  }
  return '<div id="labelcap">' +
    '<div class="labelcap" data-a="labelcapture">' +
    '<div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding:30px 12px;color:var(--text-3)">' + I.cam +
    '<b style="color:var(--text);font-size:15px">Tap to photograph the label</b>' +
    '<span class="ti" style="text-align:center;max-width:34ch;color:var(--text-2)">Fill the frame with the Nutrition Facts panel — good light, flat on, no glare</span></div></div>' +
    '<input type="file" id="labelfile" accept="image/*" capture="environment" style="display:none">' +
    '</div>';
}
/* wired once — the file input is recreated with every draw, so re-bind each time */
function bindLabelInput() {
  const inp = $("#labelfile");
  if (!inp) return;
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (file) runLabelOCR(file);
  };
}
async function runLabelOCR(file) {
  modal({
    title: "Reading the label", cls: "s-food",
    body: '<div class="empty" style="padding:26px">' + I.search + '<h3 id="ocr-status">Loading…</h3>' +
      '<p class="ti mu">This can take a few seconds on the first try.</p></div>',
    footer: '<button class="btn gh" data-a="close">Cancel</button>'
  });
  try {
    if (!TESS) {
      $("#ocr-status") && ($("#ocr-status").textContent = "Preparing the reader…");
      await loadTesseract();
    }
    $("#ocr-status") && ($("#ocr-status").textContent = "Reading the label…");
    const { data } = await TESS.recognize(file, "eng");
    const fields = parseLabelText(data);
    openFoodManual(fields);
  } catch (err) {
    /* OCR failed outright — never guess, hand it straight to manual entry */
    modal({
      title: "Couldn't read that", cls: "s-food",
      body: '<div class="empty" style="padding:20px">' + I.info + "<h3>The label wasn't readable</h3>" +
        '<p class="ti" style="max-width:44ch;margin:0 auto">Try again with better light and the panel flat and filling the frame, or just type the numbers in — it takes about the same time.</p></div>',
      footer: '<button class="btn gh" data-a="close">Close</button>' +
        '<button class="btn" data-a="scanmode" data-m="label">' + I.cam + "Try again</button>" +
        '<button class="btn pri s-food" data-a="foodmanual">' + I.pen + "Type it in</button>"
    });
  }
}
function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) { TESS = window.Tesseract; resolve(); return; }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => { TESS = window.Tesseract; TESS ? resolve() : reject(new Error("Tesseract failed to attach")); };
    s.onerror = () => reject(new Error("Could not load the OCR library"));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error("Timed out loading the OCR library")), 15000);
  });
}
/* Turns raw OCR text + per-word confidences into the same shape the food
   confirmation screen expects, with a confidence flag on every field that
   was actually read from the image (never fabricated). */
function parseLabelText(data) {
  const text = (data.text || "").replace(/\r/g, "");
  const words = data.words || [];
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  /* confidence of whichever word in `words` contains this numeric match */
  const confFor = (numStr) => {
    const hit = words.find(w => w.text && w.text.replace(/[^\d.]/g, "") === numStr);
    if (!hit) return "low";
    return hit.confidence >= 60 ? "ok" : "low";
  };
  const findNum = (patterns) => {
    for (const re of patterns) {
      const m = text.match(re);
      if (m && m[1] != null) {
        const num = m[1].replace(/,/g, "");
        return { value: parseFloat(num), conf: confFor(num) };
      }
    }
    return null;
  };

  const kcal = findNum([/calories[^\d]{0,10}(\d{1,4})/i, /energy[^\d]{0,10}(\d{1,4})\s*kcal/i, /(\d{2,4})\s*kcal/i]);
  const protein = findNum([/protein[^\d]{0,10}(\d{1,3}(?:\.\d)?)\s*g/i]);
  const carbs = findNum([/(?:total\s*)?carbohydrate[^\d]{0,10}(\d{1,3}(?:\.\d)?)\s*g/i]);
  const fat = findNum([/(?:total\s*)?fat[^\d]{0,10}(\d{1,3}(?:\.\d)?)\s*g/i]);
  const serving = findNum([/serving\s*size[^\d]{0,15}(\d{1,4})\s*(?:g|ml)/i]);
  const perContainer = findNum([/servings?\s*per\s*container[^\d]{0,10}(?:about\s*)?(\d{1,3})/i, /(\d{1,3})\s*servings?\s*per\s*container/i]);

  /* the product name is almost never on a nutrition-facts panel — leave it
     for the user rather than guess from noisy OCR text */
  return {
    n: "", nameConf: "low",
    k: kcal ? Math.round(kcal.value) : "", p: protein ? protein.value : "", c: carbs ? carbs.value : "", f: fat ? fat.value : "",
    per: serving ? Math.round(serving.value) : 100,
    servingsPerContainer: perContainer ? Math.round(perContainer.value) : null,
    confidence: {
      k: kcal ? kcal.conf : "low", p: protein ? protein.conf : "low",
      c: carbs ? carbs.conf : "low", f: fat ? fat.conf : "low"
    }
  };
}
/* ==================================================================
   AI INSIGHTS + WEEKLY COACH REPORT
   Template-driven analysis over real stored data — not a live LLM call
   (no API key is configured for this build). Every line below reads an
   actual number out of S; nothing is generic advice or a medical claim.
   ================================================================== */
function weeklyAnalysis() {
  const thisWk = weekStats(today());
  const lastWk = weekStats(shift(today(), -7));
  const scoreThis = fitnessScore("weekly", today());
  const scoreLast = fitnessScore("weekly", shift(today(), -7));
  const wRate = weightRate(21);
  const proteinDays = Array.from({ length: 7 }, (_, i) => shift(today(), -i))
    .filter(d => { const b = budget(d); return b.macros.p.eaten >= b.macros.p.target * 0.9; }).length;
  const trainedThis = trainedDays(7), trainedLast = (() => { let c = 0; for (let i = 7; i < 14; i++) if (dayLoad(shift(today(), -i)) > 0) c++; return c; })();
  const cardioMinThis = S.activities.filter(a => a.date >= shift(today(), -6)).reduce((a, x) => a + x.minutes, 0);
  return { thisWk, lastWk, scoreThis, scoreLast, wRate, proteinDays, trainedThis, trainedLast, cardioMinThis };
}
const INSIGHT_QUESTIONS = [
  "Why did my weight change?", "Am I progressing?", "Why is my Fitness Score what it is?",
  "What should I focus on tomorrow?", "How has my nutrition been this week?", "Am I hitting enough protein?",
  "Has my training consistency improved?", "What are my biggest weaknesses?", "What should I focus on next week?"
];
function answerInsight(q) {
  const A = weeklyAnalysis();
  const lines = [];
  switch (q) {
    case "Why did my weight change?": {
      if (A.wRate == null) return "Not enough weigh-ins yet — log at least two weeks of scale readings and this fills in.";
      const dir = A.wRate < 0 ? "down" : A.wRate > 0 ? "up" : "flat";
      lines.push("Your trend weight is " + dir + (A.wRate ? " " + round(Math.abs(kgOut(A.wRate)), 2) + " " + wU() + "/week" : "") + " over the last three weeks.");
      const logged = Array.from({ length: 14 }, (_, i) => shift(today(), -i)).map(d => budget(d)).filter(b => b.eaten > 0);
      if (logged.length >= 4) {
        const avgIn = logged.reduce((a, b) => a + b.eaten, 0) / logged.length;
        const avgNeed = logged.reduce((a, b) => a + b.tdee, 0) / logged.length;
        const gap = avgIn - avgNeed;
        lines.push("Over the last " + logged.length + " logged days you've averaged " + nf(avgIn) + " kcal against an estimated need of " + nf(avgNeed) + " — a " + (gap >= 0 ? "surplus" : "deficit") + " of " + nf(Math.abs(gap)) + " kcal/day, which is consistent with that direction.");
      } else {
        lines.push("Log food more consistently and this can connect the weight change to your actual intake instead of just the trend line.");
      }
      break;
    }
    case "Am I progressing?": {
      const strength = strengthRecords();
      const topPR = strength[0];
      lines.push(topPR ? "Your top lift is " + esc(topPR.n) + " at an estimated " + wTxt(topPR.e1) + " 1RM." : "No strength PRs logged yet.");
      lines.push("This week: " + A.trainedThis + " training day" + (A.trainedThis === 1 ? "" : "s") + " vs " + A.trainedLast + " the week before.");
      if (A.wRate != null && S.profile.targetKg) {
        const towards = (S.profile.targetKg - currentWeight()) * A.wRate > 0 ? "moving toward" : "moving away from";
        lines.push("Your weight trend is " + towards + " your goal weight.");
      }
      break;
    }
    case "Why is my Fitness Score what it is?": {
      if (A.scoreThis.score == null) { lines.push("Not enough data logged yet for a score."); break; }
      lines.push("This week's score is " + A.scoreThis.score + "/100, built from: " + A.scoreThis.have.map(k => k + " " + A.scoreThis.parts[k]).join(", ") + ".");
      const worst = A.scoreThis.have.slice().sort((a, b) => A.scoreThis.parts[a] - A.scoreThis.parts[b])[0];
      if (worst) lines.push(worst + " is pulling it down the most right now.");
      break;
    }
    case "What should I focus on tomorrow?": {
      const rec = recommendation();
      lines.push(rec.verdict === "REST" ? "Your training load is high — a rest or light day is the priority." : "You're recovered enough to train.");
      const b = budget(today());
      if (b.macros.p.eaten < b.macros.p.target * 0.7) lines.push("Protein has been light today — worth prioritizing tomorrow.");
      break;
    }
    case "How has my nutrition been this week?": {
      lines.push("Logged " + A.thisWk.daysWithFood + " of 7 days" + (A.thisWk.avgKcal ? ", averaging " + nf(A.thisWk.avgKcal) + " kcal on logged days." : "."));
      lines.push("Protein target hit on " + A.proteinDays + " of the last 7 days.");
      break;
    }
    case "Am I hitting enough protein?": {
      lines.push(A.proteinDays + " of the last 7 days hit your protein target.");
      lines.push(A.proteinDays >= 5 ? "That's a solid, consistent pattern." : "Worth paying closer attention to — a bigger protein source at breakfast or lunch is usually the easiest fix.");
      break;
    }
    case "Has my training consistency improved?": {
      lines.push("This week: " + A.trainedThis + " day" + (A.trainedThis === 1 ? "" : "s") + " trained. Previous week: " + A.trainedLast + ".");
      lines.push(A.trainedThis > A.trainedLast ? "That's an improvement." : A.trainedThis < A.trainedLast ? "That's down from last week." : "Same as last week.");
      break;
    }
    case "What are my biggest weaknesses?": {
      if (A.scoreThis.have.length) {
        const worst = A.scoreThis.have.slice().sort((a, b) => A.scoreThis.parts[a] - A.scoreThis.parts[b]).slice(0, 2);
        lines.push("Lowest-scoring areas this week: " + worst.map(k => k + " (" + A.scoreThis.parts[k] + ")").join(", ") + ".");
      }
      if (A.proteinDays < 4) lines.push("Protein consistency is a recurring gap.");
      if (A.cardioMinThis < 90) lines.push("Cardio minutes are low this week (" + Math.round(A.cardioMinThis) + " min).");
      if (!lines.length) lines.push("Nothing stands out badly right now — fairly balanced week.");
      break;
    }
    case "What should I focus on next week?": {
      if (A.trainedThis < 3) lines.push("Get at least 3 training days in.");
      if (A.proteinDays < 5) lines.push("Hit protein on more days — aim for 6 of 7.");
      if (A.cardioMinThis < 150) lines.push("Add cardio toward the ~150 min/week guideline.");
      if (!lines.length) lines.push("Keep doing what you're doing — this week was solid across the board.");
      break;
    }
  }
  return lines.length ? lines : ["Not enough logged data yet to answer that one specifically."];
}
function openInsights() {

function openWeeklyReport() {

  const s = A.thisWk;

    (A.wRate != null ? '<div class="ti">Weight trend: <b>' + (A.wRate > 0 ? "↑" : A.wRate < 0 ? "↓" : "→") + " " + round(Math.abs(kgOut(A.wRate)), 2) + " " + wU() + "/wk</b></div>" : "") +
    (scoreDelta != null ? '<div class="ti">Fitness score: <b>' + (scoreDelta > 0 ? "↑" : scoreDelta < 0 ? "↓" : "→") + " " + Math.abs(scoreDelta) + " pts</b> (" + A.scoreLast.score + " → " + A.scoreThis.score + ")</div>" : "") +
    (strengthTrend ? '<div class="ti">Top lift: <b>' + esc(strengthTrend.n) + " " + wTxt(strengthTrend.e1) + " e1RM</b></div>" : "") +
    "</div>" +
    '<div class="eb" style="margin-bottom:8px">Coach\'s take</div>' +
    '<div class="card tint s-core" style="box-shadow:none;margin-bottom:16px">' +
    '<p class="ti" style="margin:0 0 6px"><b>Biggest improvement:</b> ' + esc(improvement) + "</p>" +
    '<p class="ti" style="margin:0"><b>Biggest weakness:</b> ' + esc(weakness) + "</p></div>" +

    (hydrationDays < 5 ? "<li>Log water more days — aim for 5+.</li>" : "") +

/* ==================================================================
   GYM WORKOUTS

  const date = ($("#sw_date") || {}).value || L.date;
  const watch = Math.max(0, Math.round(+($("#sw_kcal") || {}).value || 0));
  const notes = (($("#sw_notes") || {}).value || L.notes || "").trim();

  const preSessionPR = {};

  const targetByExId = {};
  L.exercises.forEach(e => { if (e.targetLo) targetByExId[e.exId] = { lo: e.targetLo, hi: e.targetHi }; });

  const w = {
    id: L.id, date, ts: Date.now(), name: (L.name || "").trim() || "Workout",
    minutes, notes, watchKcal: watch || null, exercises

  const i = S.workouts.findIndex(x => x.id === w.id);

/* ==================================================================
   REST TIMER
   Tick a set -> the set is marked done, the timer starts on that
   exercise's own rest length, the next set becomes active, and at
   zero the phone buzzes and beeps.
   ================================================================== */
const REST_PRESETS = [30, 45, 60, 90, 120, 150, 180, 240];
let rest = null, restT = null;

/* index of the next set still to be done, for the active-row highlight */
function activeSetIndex(e) {
  for (let i = 0; i < e.sets.length; i++) if (!e.sets[i].done) return i;
  return -1;
}
function startRest(sec, label, exUid) {
  if (!(sec > 0)) return;
  rest = { end: Date.now() + sec * 1000, total: sec, label: label || "", exUid: exUid || null, paused: false, fired: false };
  drawRest();
  clearInterval(restT);
  restT = setInterval(drawRest, 200);
}
function stopRest(silent) {
  const wasResting = !!rest;
  rest = null; clearInterval(restT);
  const n = $("#tmr"); if (n) n.innerHTML = "";
  /* the inline strip only exists inside a render of the gym route — swap it
     back to the "next set" card automatically, not just when tapped */
  if (wasResting && !silent && ROUTE === "gym") render();
}
function pauseRest() {
  if (!rest) return;
  if (rest.paused) { rest.end = Date.now() + rest.left * 1000; rest.paused = false; }
  else { rest.left = Math.max(0, (rest.end - Date.now()) / 1000); rest.paused = true; }
  drawRest();
}
function bumpRest(sec) {
  if (!rest) return;
  if (rest.paused) rest.left = Math.max(0, rest.left + sec);
  else rest.end += sec * 1000;
  if (sec > 0) { rest.total += sec; rest.fired = false; }
  drawRest();
}
function restLeft() { return rest ? (rest.paused ? rest.left : (rest.end - Date.now()) / 1000) : 0; }

/* ---------- the alarm ---------- */
let AC = null;
function beep() {
  if (S.sound === false) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    [0, 0.18, 0.36].forEach((t, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(i === 2 ? 1046 : 784, AC.currentTime + t);
      g.gain.setValueAtTime(0.0001, AC.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, AC.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t + 0.15);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime + t); o.stop(AC.currentTime + t + 0.16);
    });
  } catch (e) { /* audio unavailable — the vibration and the visual still fire */ }
}
function buzz() {
  if (S.vibrate === false) return;
  try { if (navigator.vibrate) navigator.vibrate([180, 90, 180, 90, 300]); } catch (e) { }
}
/* browsers require a user gesture before audio will play — unlock on the
   first tap of a workout so the alarm is allowed to sound later */
function primeAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { }
}

/* Paints wherever the rest state is visible. Prefers patching the inline
   strip in place (cheap, keeps focus/scroll) and only falls back to a
   floating pill when the logger screen isn't the one on display — e.g. the
   user opened the exercise-jump sheet mid-rest. */
function drawRest() {
  if (!rest) { const n = $("#tmr"); if (n) n.innerHTML = ""; return; }
  const left = restLeft();
  const over = left <= 0;
  if (over && !rest.fired) { rest.fired = true; beep(); buzz(); }
  if (left <= -45) { stopRest(); return; }   /* long-abandoned rest quietly clears itself */

  const inline = $("#reststrip-live");
  if (inline && ROUTE === "gym") {
    const clock = $("#rs-clock"), bar = $("#rs-bar"), lab = inline.querySelector(".rs-lab");
    if (clock) clock.textContent = over ? "Go" : mmss(left);
    if (bar) bar.style.width = clamp(left / rest.total * 100, 0, 100) + "%";
    if (lab) lab.textContent = over ? "Rest complete" : rest.paused ? "Paused" : "Resting";
    inline.classList.toggle("over", over);
    const skipBtn = inline.querySelector('[data-a="restdone"]');
    if (skipBtn) skipBtn.textContent = over ? "Continue" : "Skip rest";
    const pauseBtn = inline.querySelector('[data-a="restp"]');
    if (pauseBtn) pauseBtn.textContent = rest.paused ? "Resume" : "Pause";
    const host = $("#tmr"); if (host) host.innerHTML = "";
    return;
  }
  const host = $("#tmr");
  if (!host) return;
  const pct = clamp(left / rest.total * 100, 0, 100);
  host.innerHTML = '<div class="rest ' + (over ? "over" : "") + (rest.paused ? " paused" : "") + '" role="timer" aria-live="polite">' +
    (rest.label ? '<div class="done">' + I.check + esc(rest.label) + " completed</div>" : "") +
    '<div class="lab">' + (over ? "Rest complete — go" : rest.paused ? "Paused" : "Rest") + "</div>" +
    '<div class="rt">' + (over ? "00:00" : mmss(left)) + "</div>" +
    '<div class="acts">' +
    '<button data-a="rest+">+30 sec</button>' +
    '<button data-a="restp">' + (rest.paused ? "Resume" : "Pause") + "</button>" +
    '<button data-a="restdone">' + (over ? "Continue" : "Skip") + "</button></div>" +
    '<span class="rb" style="width:' + pct + '%"></span></div>';
}

function moveRoutineItem(id, from, dir) {
  const t = S.templates.find(x => x.id === id);
  if (!t) return;
  const to = from + dir;
  if (to < 0 || to >= t.items.length) return;
  const [it] = t.items.splice(from, 1);

/* Dragging works off the handle only, so the list itself still scrolls. */
let DRAG = null;
function startRoutineDrag(e, index) {
  const list = $("#rtlist");
  if (!list) return;
  const rid = list.dataset.rid;
  const rows = $$(".rrow", list);
  const row = rows[index];
  if (!row) return;
  DRAG = { rid, from: index, cur: index, rows, row, startY: e.clientY, list };
  row.classList.add("dragging");
  list.classList.add("dragging-active");
  try { e.target.setPointerCapture(e.pointerId); } catch (err) { }
  e.preventDefault();
}
function moveRoutineDrag(e) {
  if (!DRAG) return;
  e.preventDefault();
  const y = e.clientY;
  let target = DRAG.cur;
  DRAG.rows.forEach((r, i) => {
    if (r === DRAG.row) return;
    const b = r.getBoundingClientRect();
    const mid = b.top + b.height / 2;
    if (i < DRAG.cur && y < mid) target = Math.min(target, i);
    if (i > DRAG.cur && y > mid) target = Math.max(target, i);
  });
  if (target !== DRAG.cur) {
    const ref = target > DRAG.cur ? DRAG.rows[target].nextSibling : DRAG.rows[target];
    DRAG.list.insertBefore(DRAG.row, ref);
    DRAG.rows = $$(".rrow", DRAG.list);
    DRAG.cur = DRAG.rows.indexOf(DRAG.row);
  }
}
function endRoutineDrag() {
  if (!DRAG) return;
  const { rid, from, cur } = DRAG;
  DRAG.row.classList.remove("dragging");
  DRAG.list.classList.remove("dragging-active");
  DRAG = null;
  if (from === cur) { openRoutine(rid); return; }
  const t = S.templates.find(x => x.id === rid);
  if (t) {
    const [it] = t.items.splice(from, 1);
    t.items.splice(cur, 0, it);
    save();
    toast("Order saved");
  }
  openRoutine(rid);
}

document.addEventListener("pointercancel", endRoutineDrag);

/* ==================================================================
   THE WORKOUT LOGGER

const exDone = e => e.sets.filter(s => s.done).length;
const exTotal = e => e.sets.length;

function stepFor(field, cur) {

}
function bumpSet(uid, i, field, dir) {
  const e = findEx(uid); if (!e || !e.sets[i]) return;
  primeAudio();
  const s = e.sets[i];
  const cur = +s[field] || 0;
  const step = stepFor(field, cur);
  const next = Math.max(0, round(cur + step * dir, 2));

  save();

}
function paintSetInputs(uid, i) {

/* the "vs last time" pill next to the set, kept live as the numbers change */

  const dw = round((+curW || 0) - prevSet.w, 2);
  const dr = (+curR || 0) - prevSet.r;
  if (isPr && (+curW || 0) > pr.w) return '<span class="diffpill pr">' + I.trophy + " PR</span>";
  if (dw > 0) return '<span class="diffpill up">+' + round(kgOut(dw), 1) + " " + wU() + "</span>";
  if (dw < 0) return '<span class="diffpill down">' + round(kgOut(dw), 1) + " " + wU() + "</span>";
  if (dr > 0) return '<span class="diffpill up">+' + dr + " rep" + (dr === 1 ? "" : "s") + "</span>";

function paintDiff(uid, i) {

/* ==================================================================
   FITBIT / GOOGLE TAKEOUT IMPORT
   Reads the JSON files out of a Google Takeout export of your Fitbit
   data. No API, no OAuth, nothing to expire — the files are read in
   the browser and never leave it.
   Handles the two things worth importing: exercise sessions (which
   carry the watch's calorie figure) and weight logs.
   ================================================================== */
let FB = { sessions: [], weights: [], files: [], mapping: {}, wUnit: "auto", errors: [] };

/* Fitbit writes dates as "05/12/24 18:30:15", sometimes ISO. Take both. */
function fbDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [, a, b, y] = m;
    y = +y < 100 ? 2000 + +y : +y;
    /* Fitbit uses US order: month/day/year */
    const d = new Date(y, +a - 1, +b, 12);
    return isNaN(d) ? null : iso(d);
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const d = new Date(s);
  return isNaN(d) ? null : iso(d);
}
function fbTime(v) {
  const s = String(v || "");
  const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? String(m[1]).padStart(2, "0") + ":" + m[2] : "";
}
/* which of our two kinds does a Fitbit activity name belong to? */
function guessKind(name) {
  const n = String(name || "").toLowerCase();
  if (/padel|tennis|squash|badminton|pickle|racquet|racket/.test(n)) return "padel";
  if (/weight|strength|workout|gym|lift|circuit|bootcamp/.test(n)) return "gym";
  return "ignore";
}

function readTakeout(fileList) {
  FB = { sessions: [], weights: [], files: [], mapping: {}, wUnit: "auto", errors: [] };
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let pending = files.length;
  files.forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      try { ingestTakeout(f.name, JSON.parse(r.result)); FB.files.push(f.name); }
      catch (e) { FB.errors.push(f.name + " — not readable JSON"); }
      if (--pending === 0) finishTakeout();
    };
    r.onerror = () => { FB.errors.push(f.name + " — could not be read"); if (--pending === 0) finishTakeout(); };
    r.readAsText(f);
  });
}
function ingestTakeout(name, data) {
  const rows = Array.isArray(data) ? data : [data];
  rows.forEach(row => {
    if (!row || typeof row !== "object") return;
    /* --- exercise session --- */
    if (row.activityName || row.activityTypeId || (row.duration && (row.startTime || row.originalStartTime))) {
      const date = fbDate(row.originalStartTime || row.startTime || row.dateTime);
      const mins = Math.round((+row.activeDuration || +row.duration || 0) / 60000);
      if (!date || mins < 1) return;
      FB.sessions.push({
        name: row.activityName || "Activity", date,
        time: fbTime(row.originalStartTime || row.startTime),
        minutes: mins, kcal: Math.round(+row.calories || 0),
        hr: Math.round(+row.averageHeartRate || 0), pick: true
      });
      return;
    }
    /* --- weight log --- */
    if (row.weight != null && (row.date || row.dateTime || row.logId)) {
      const date = fbDate(row.date || row.dateTime);
      const v = +row.weight;
      if (!date || !(v > 0)) return;
      FB.weights.push({ date, value: v, time: fbTime(row.time), pick: true });
    }
  });
}
function finishTakeout() {
  /* newest first, de-duplicated */
  const seen = {};
  FB.sessions = FB.sessions.filter(s => { const k = s.date + s.time + s.name; if (seen[k]) return false; seen[k] = 1; return true; })
    .sort((a, b) => a.date < b.date ? 1 : -1);
  const ws = {};
  FB.weights = FB.weights.filter(w => { if (ws[w.date]) return false; ws[w.date] = 1; return true; })
    .sort((a, b) => a.date < b.date ? 1 : -1);
  /* default mapping per distinct activity name */
  [...new Set(FB.sessions.map(s => s.name))].forEach(n => FB.mapping[n] = guessKind(n));
  /* guess the weight unit from the numbers themselves */
  if (FB.weights.length) {
    const avg = FB.weights.reduce((a, w) => a + w.value, 0) / FB.weights.length;
    FB.wUnit = avg > 120 ? "lb" : "kg";
  }
  drawTakeout();
}

function openTakeout() {

  modal({
    title: "Import from Fitbit", cls: "s-move",
    body: '<p class="ti mu" style="margin:0 0 12px;line-height:1.6">Google Takeout gives you your Fitbit history as JSON files. Pick the ones you want — <b>Physical Activity</b> for sessions and their calorie figures, and <b>weight</b> files for your weigh-ins. The files are read here in the browser and never leave your phone.</p>' +
      '<label class="launch s-move" style="display:block"><span class="ti mu"></span>' +
      '<input type="file" id="fbfile" accept=".json,application/json" multiple style="display:none">' +
      '<button class="btn pri s-move bl" data-a="fbpick">' + I.up + "Choose Takeout files</button></label>" +
      '<div class="card" style="margin-top:14px;background:var(--surface-2);box-shadow:none">' +

function drawTakeout() {
  const names = Object.keys(FB.mapping);
  const chosenS = FB.sessions.filter(s => s.pick && FB.mapping[s.name] !== "ignore");
  const chosenW = FB.weights.filter(w => w.pick);

      footer: '<button class="btn gh" data-a="close">Close</button><button class="btn pri s-move" data-a="fbopen">Try other files</button>'
    });
    return;
  }
  let body = '<p class="ti mu" style="margin:0 0 12px">Read ' + FB.files.length + " file" + (FB.files.length === 1 ? "" : "s") +
    ". Nothing is saved until you press Import.</p>";
  if (names.length) {
    body += '<div class="eb" style="margin-bottom:8px">What each activity should become</div>';
    body += names.map(n => {

      const cur = FB.mapping[n];
      return '<div class="pline"><div class="hd2"><b style="flex:1">' + esc(n) + '</b><span class="chip pl">' + count + "</span></div>" +
        '<div class="seg s-move k" style="width:100%">' +
        [["padel", "Padel"], ["gym", "Gym"], ["ignore", "Skip"]].map(([v, l]) =>
          '<button data-a="fbmap" data-n="' + esc(n) + '" data-v="' + v + '" class="' + (cur === v ? "on" : "") + '" style="flex:1">' + l + "</button>").join("") +
        "</div></div>";
    }).join("");
  }
  if (FB.weights.length) {
    body += '<div class="eb" style="margin:14px 0 8px">Weigh-ins</div>' +
      '<div class="pline"><div class="hd2"><b style="flex:1">' + FB.weights.length + " weight readings</b></div>" +
      '<div class="ti mu" style="margin-bottom:8px">Values look like <b>' + round(FB.weights[0].value, 1) + "</b> — is that pounds or kilograms?</div>" +
      '<div class="seg s-move k" style="width:100%">' +
      [["kg", "Kilograms"], ["lb", "Pounds"]].map(([v, l]) =>
        '<button data-a="fbunit" data-v="' + v + '" class="' + (FB.wUnit === v ? "on" : "") + '" style="flex:1">' + l + "</button>").join("") + "</div></div>";
  }
  const preview = chosenS.slice(0, 6);
  if (preview.length) {
    body += '<div class="eb" style="margin:14px 0 8px">First few sessions</div><div class="stack">' +
      preview.map(s => '<div class="item ' + (FB.mapping[s.name] === "padel" ? "s-weight" : "s-move") + '">' +
        '<span class="ic">' + (FB.mapping[s.name] === "padel" ? I.padel : I.gym) + "</span>" +
        '<span style="min-width:0"><span class="tt" style="display:block">' + esc(s.name) + "</span>" +
        '<span class="mt">' + fmtD(s.date) + (s.time ? " · " + s.time : "") + " · " + durT(s.minutes) + "</span></span>" +
        '<span class="rt mo" style="font-weight:600">' + (s.kcal ? nf(s.kcal) + " kcal" : "—") + "</span></div>").join("") + "</div>";
  }
  body += '<div class="card tint s-move" style="margin-top:14px;box-shadow:none"><div class="btw wr" style="gap:10px">' +
    '<div><div class="eb">Ready to import</div><div class="bignum" style="font-size:24px;color:var(--out-ink)">' +
    chosenS.length + " session" + (chosenS.length === 1 ? "" : "s") + "</div></div>" +
    '<div style="text-align:right"><div class="eb">Weigh-ins</div><div class="bignum" style="font-size:24px;color:var(--wt-ink)">' + chosenW.length + "</div></div></div>" +
    '<div class="ti mu" style="margin-top:8px">Anything already logged on the same date and time is skipped, so importing twice is safe.</div></div>';
  modal({
    title: "Check the import", cls: "s-move", body,
    footer: '<button class="btn gh" data-a="fbopen">Back</button>' +
      '<button class="btn pri s-move" data-a="fbimport"' + (chosenS.length + chosenW.length ? "" : " disabled") + ">" + I.check + "Import</button>"
  });
}
function runTakeoutImport() {
  let nS = 0, nW = 0, skipped = 0;
  FB.sessions.forEach(s => {
    const kind = FB.mapping[s.name];
    if (!s.pick || kind === "ignore") return;
    if (kind === "padel") {
      if (S.padel.some(p => p.date === s.date && (p.startTime || "") === s.time)) { skipped++; return; }
      pushActivity({
        id: uid(), ts: Date.now(), type: "padel", date: s.date, startTime: s.time, minutes: s.minutes,
        distance: null, intensity: "moderate", intensitySet: false, watchKcal: s.kcal || null, heartRate: null,
        notes: "Imported from Fitbit — " + s.name, kind: "match", opponent: "", partner: "", sets: [], result: "unset"
      });
      nS++;
    } else {
      if (S.workouts.some(w => w.date === s.date && w.name === s.name)) { skipped++; return; }
      S.workouts.push({
        id: uid(), date: s.date, ts: Date.now(), name: s.name, minutes: s.minutes,
        notes: "Imported from Fitbit", watchKcal: s.kcal || null, exercises: []
      });
      nS++;
    }
  });
  FB.weights.forEach(w => {
    if (!w.pick) return;
    if (S.weights.some(x => x.date === w.date)) { skipped++; return; }
    S.weights.push({ date: w.date, kg: FB.wUnit === "lb" ? w.value / 2.2046226 : w.value });
    nW++;
  });
  if (nS || nW) { S.profile.done = true; save(); }
  closeModal();
  toast(nS + " session" + (nS === 1 ? "" : "s") + " and " + nW + " weigh-in" + (nW === 1 ? "" : "s") + " imported" +
    (skipped ? " · " + skipped + " already there" : ""));
  go("home");
}

/* ==================================================================
   FITBIT — LIVE SYNC (automatic, via the Netlify Functions in
   netlify/functions/fitbit-*.js)
   This talks only to this site's own /.netlify/functions/ endpoints —
   never to Fitbit directly, and no token or secret is ever visible to
   this code. On a deployment without those Functions configured (e.g.
   this file opened locally, or Fitbit env vars not set), every call
   below fails closed and the UI says so honestly instead of pretending
   to be connected.
   ================================================================== */
async function fitbitApiStatus() {
  try {
    const res = await fetch("/.netlify/functions/fitbit-status");
    if (!res.ok) return { connected: false, unavailable: true };
    return await res.json();
  } catch (e) { return { connected: false, unavailable: true }; }
}
function connectFitbit() { window.location.href = "/.netlify/functions/fitbit-authorize"; }
async function syncFitbitNow() {
  toast("Syncing with Fitbit…");
  try {
    const res = await fetch("/.netlify/functions/fitbit-sync?date=" + today());
    if (res.status === 401) { toast("Fitbit needs reconnecting."); render(); return; }
    if (!res.ok) { toast("Fitbit sync unavailable"); return; }
    const d = await res.json();
    if (d.steps != null) S.steps[d.date] = d.steps;
    if (d.sleepHours != null) S.sleep[d.date] = d.sleepHours;
    if (d.restingHeartRate != null) S.fitbit.restingHR[d.date] = d.restingHeartRate;
    if (d.hrv != null) S.fitbit.hrv[d.date] = d.hrv;
    S.fitbit.connected = true; S.fitbit.lastSync = Date.now();
    save(); toast("Fitbit synced"); render();
  } catch (e) { toast("Fitbit sync unavailable"); }
}
async function disconnectFitbit() {
  if (!confirm("Disconnect Fitbit? This revokes access and stops automatic sync.")) return;
  try { await fetch("/.netlify/functions/fitbit-disconnect", { method: "POST" }); } catch (e) { }
  S.fitbit.connected = false; save(); toast("Fitbit disconnected"); render();
}
/* checked once when Settings opens — not polled, so it never hammers Fitbit */
async function refreshFitbitStatus() {
  const st = await fitbitApiStatus();
  S.fitbit.connected = !!st.connected;
  S.fitbit.lastSync = st.lastSync || S.fitbit.lastSync;
  const host = $("#fitbit-live-status");
  if (host) host.outerHTML = fitbitLiveCard();
}
function fitbitLiveCard() {
  const f = S.fitbit;
  return '<div id="fitbit-live-status" class="card s-move"><div class="btw wr" style="gap:11px">' +
    '<div><b>Fitbit</b><div class="ti mu">' +
    (f.connected ? "Connected" + (f.lastSync ? " · last synced " + relD(iso(new Date(f.lastSync))).toLowerCase() : "") : "Not connected") +
    "</div></div>" +
    (f.connected
      ? '<div class="row" style="gap:7px"><button class="btn sm gh" data-a="fbsyncnow">' + I.trend + "Sync now</button>" +
      '<button class="btn sm dg" data-a="fbdisconnect">Disconnect</button></div>'
      : '<button class="btn sm pri s-move" data-a="fbconnect">' + I.plus + "Connect Fitbit</button>") +
    "</div>" +
    '<p class="ti mu" style="margin:11px 0 0;line-height:1.6">Automatic sync via a secure server-side connection — this deployment needs Fitbit app credentials configured first (see SETUP.md). Steps and sleep feed straight into Daily Goals and the Fitness Score; resting heart rate and HRV (where your device reports them) feed Recovery.</p></div>';
}

/* ==================================================================
   RECOVERY SCORE
   Built only from metrics that are actually present, and interpreted
   against your OWN recent baseline rather than a population average —
   a resting HR of 58 means something different for two different
   people. Not a medical read; see the disclaimer wherever it's shown.
   ================================================================== */
function personalBaseline(store, days, excludeToday) {
  const vals = [];
  for (let i = excludeToday ? 1 : 0; i < days + (excludeToday ? 1 : 0); i++) {
    const d = shift(today(), -i);
    if (store[d] != null) vals.push(store[d]);
  }
  if (vals.length < 3) return null; // not enough history to call it a baseline yet
  vals.sort((a, b) => a - b);
  return vals[Math.floor(vals.length / 2)]; // median — one bad night doesn't skew it
}
function recoveryScore() {
  const d = today();
  const parts = {};
  if (S.sleep[d] != null) parts.Sleep = clamp(Math.round(S.sleep[d] / S.goals.sleepTargetHrs * 100), 0, 115);
  const hrBase = personalBaseline(S.fitbit.restingHR, 21, true);
  if (S.fitbit.restingHR[d] != null && hrBase) {
    // lower than your own baseline = better recovery; higher = worse
    const diff = hrBase - S.fitbit.restingHR[d];
    parts["Resting HR"] = clamp(Math.round(70 + diff * 4), 0, 100);
  }
  const hrvBase = personalBaseline(S.fitbit.hrv, 21, true);
  if (S.fitbit.hrv[d] != null && hrvBase) {
    const diff = S.fitbit.hrv[d] - hrvBase;
    parts.HRV = clamp(Math.round(70 + diff * 2), 0, 100);
  }
  const rec = recommendation();
  parts["Activity/Fatigue"] = clamp(100 - rec.fatigue, 0, 100);
  const have = Object.keys(parts);
  const score = have.length ? Math.round(have.reduce((a, k) => a + parts[k], 0) / have.length) : null;
  return { score, parts, have };
}
function recoveryCard() {
  const r = recoveryScore();
  if (r.score == null) return "";
  const status = r.score >= 75 ? "Good recovery" : r.score >= 50 ? "Moderate recovery" : "Low recovery — consider easing off";
  return '<div class="sect"><div class="sect-hd"><h2>Recovery</h2></div>' +

    r.have.map(k => '<div class="sbrow"><span class="sbn">' + k + '</span><span class="sbtrack"><span class="sbfill" style="width:' + r.parts[k] + "%;background:" + scoreColor(r.parts[k]) + '"></span></span><span class="sbv">' + r.parts[k] + "</span></div>").join("") +
    "</div></div><p class=\"ti mu\" style=\"margin:0\">" + status + " — from " + r.have.join(", ").toLowerCase() + ". Not a medical measurement.</p></div>";
}
function openRecoveryDetail() {
  const r = recoveryScore();
  const body = r.score == null

        "</div></div><p class=\"ti mu\" style=\"margin:14px 0 0\">" + status + " — from " + r.have.join(", ").toLowerCase() + ". Interpreted against your own recent baseline where possible, not a population average. Not a medical measurement.</p>";

/* ==================================================================
   QUICK-ADD BY LINK
   The app can be opened with the numbers already attached:
     ?add=padel&min=90&kcal=1050
   An Apple Shortcut can read today's figures out of Apple Health
   (where the Fitbit app syncs them) and open that link, so a session
   lands in the log without typing. No account linking, nothing to
   expire. Add &go=1 to skip the confirmation step.
   ================================================================== */
function readQuickAdd(searchStr) {
  let q;
  try { q = new URLSearchParams(searchStr != null ? searchStr : (window.location.search || "")); }
  catch (e) { return null; }
  if (!q) return null;
  const kind = (q.get("add") || "").trim().toLowerCase();
  if (!kind) return null;
  const s = k => (q.get(k) || "").trim();
  const n = k => { const v = parseFloat(s(k)); return isFinite(v) ? v : null; };
  const d = s("date");
  return {
    kind,
    date: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : today(),
    time: /^\d{1,2}:\d{2}$/.test(s("time")) ? s("time") : "",
    min: n("min"), kcal: n("kcal"), kg: n("kg"), lb: n("lb"),
    name: s("name"), meal: s("meal"), p: n("p"), c: n("c"), f: n("f"),
    auto: s("go") === "1"
  };
}
/* take the parameters off the address bar so a refresh cannot double-log */
function clearQuickAdd() {
  try { window.history.replaceState({}, "", window.location.pathname); } catch (e) { }
}
