<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Even Keel</title>
<meta name="description" content="A manual fitness log: food, weight, gym and padel in one place, with macro targets, a weight trend and a train-or-rest read.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Even Keel">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232B4BE0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 14h14l-3 4.6a1.8 1.8 0 0 1-1.5.7H9.5a1.8 1.8 0 0 1-1.5-.7Z'/%3E%3Cpath d='M12 14V4.5M12 4.5l4.4 3.6L12 10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%232B4BE0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 14h14l-3 4.6a1.8 1.8 0 0 1-1.5.7H9.5a1.8 1.8 0 0 1-1.5-.7Z'/%3E%3Cpath d='M12 14V4.5M12 4.5l4.4 3.6L12 10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">

</head>
<body>
<title>Even Keel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
/* ================= TOKENS ================= */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6FA; --surface-3:#E7E9F1;
  --line:#DBDEE9; --line-2:#C3C8D9;
  --text:#14161F; --text-2:#555C70; --text-3:#62697C;
  --ac:#2B4BE0; --ac-soft:#E5E9FE; --ac-line:#BFC9F8;
  --in:#D9860A; --in-ink:#96600A; --in-soft:#FCF1DE; --in-line:#EFD4A3;
  --out:#0E8C86; --out-ink:#0A6F6A; --out-soft:#DEF3F1; --out-line:#A9DCD8;
  --wt:#5B34C4; --wt-ink:#5B34C4; --wt-soft:#EBE6FB; --wt-line:#CDC0F1;
  --good:#157F43; --good-soft:#E2F4E9; --good-line:#B4DFC6;
  --warn:#8A5804; --warn-soft:#FCF0DB; --warn-line:#EDCF9C;
  --crit:#C4283A; --crit-soft:#FBE6E8; --crit-line:#F0BEC5;
  --shadow:0 1px 2px rgba(20,22,31,.05),0 8px 22px -14px rgba(20,22,31,.22);
  --shadow-lg:0 2px 5px rgba(20,22,31,.07),0 26px 50px -22px rgba(20,22,31,.34);
  --r:15px; --r-sm:10px; --r-lg:22px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --dp:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mo:"Spline Sans Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --surface:#171A21; --surface-2:#1D2129; --surface-3:#262B35;
    --line:#2C313C; --line-2:#3E4552;
    --text:#EDEFF4; --text-2:#9AA1B1; --text-3:#838B9D;
    --ac:#7B90FF; --ac-soft:#191E33; --ac-line:#333C5C;
    --in:#F7B04A; --in-ink:#F7B04A; --in-soft:#2B2114; --in-line:#513E20;
    --out:#2FD9CE; --out-ink:#2FD9CE; --out-soft:#0F2A29; --out-line:#1E504D;
    --wt:#AF93FF; --wt-ink:#AF93FF; --wt-soft:#211A34; --wt-line:#3E3160;
    --good:#3ED489; --good-soft:#0F2A1E; --good-line:#1E4F37;
    --warn:#F2B33F; --warn-soft:#2B2214; --warn-line:#524020;
    --crit:#FF6E7E; --crit-soft:#2E171C; --crit-line:#572B33;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55),0 26px 52px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A21; --surface-2:#1D2129; --surface-3:#262B35;
  --line:#2C313C; --line-2:#3E4552;
  --text:#EDEFF4; --text-2:#9AA1B1; --text-3:#838B9D;
  --ac:#7B90FF; --ac-soft:#191E33; --ac-line:#333C5C;
  --in:#F7B04A; --in-ink:#F7B04A; --in-soft:#2B2114; --in-line:#513E20;
  --out:#2FD9CE; --out-ink:#2FD9CE; --out-soft:#0F2A29; --out-line:#1E504D;
  --wt:#AF93FF; --wt-ink:#AF93FF; --wt-soft:#211A34; --wt-line:#3E3160;
  --good:#3ED489; --good-soft:#0F2A1E; --good-line:#1E4F37;
  --warn:#F2B33F; --warn-soft:#2B2214; --warn-line:#524020;
  --crit:#FF6E7E; --crit-soft:#2E171C; --crit-line:#572B33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -14px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55),0 26px 52px -22px rgba(0,0,0,.8);
}
/* domain scopes: k = this section's colour */
.s-food{--k:var(--in);--k-ink:var(--in-ink);--k-soft:var(--in-soft);--k-line:var(--in-line)}
.s-move{--k:var(--out);--k-ink:var(--out-ink);--k-soft:var(--out-soft);--k-line:var(--out-line)}
.s-weight{--k:var(--wt);--k-ink:var(--wt-ink);--k-soft:var(--wt-soft);--k-line:var(--wt-line)}
.s-core{--k:var(--ac);--k-ink:var(--ac);--k-soft:var(--ac-soft);--k-line:var(--ac-line)}
.s-good{--k:var(--good);--k-ink:var(--good);--k-soft:var(--good-soft);--k-line:var(--good-line)}
.s-warn{--k:var(--warn);--k-ink:var(--warn);--k-soft:var(--warn-soft);--k-line:var(--warn-line)}
.s-crit{--k:var(--crit);--k-ink:var(--crit);--k-soft:var(--crit-soft);--k-line:var(--crit-line)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--dp);margin:0;text-wrap:balance;line-height:1.13;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--k,#2B4BE0);outline-offset:2px;border-radius:6px}
.mo{font-family:var(--mo);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ================= SHELL ================= */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;gap:2px;z-index:40;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mk{width:34px;height:34px;border-radius:11px;background:var(--ac);flex:none;display:grid;place-items:center}
.brand .mk svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.1}
.brand b{font-family:var(--dp);font-weight:800;font-size:18.5px;display:block;letter-spacing:-.03em}
.brand small{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.nb{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;border:0;background:transparent;
  color:var(--text-2);font-weight:600;font-size:14.5px;cursor:pointer;width:100%;text-align:left;transition:background .14s,color .14s}
.nb svg{width:19px;height:19px;flex:none;stroke-width:1.85;fill:none;stroke:currentColor}
.nb:hover{background:var(--surface-2);color:var(--text)}
.nb.on{background:var(--k-soft,var(--surface-3));color:var(--k-ink,var(--text))}
.nb .bdg{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--k-ink,var(--text-3));color:#fff;
  padding:1px 7px;border-radius:20px}
:root[data-theme="dark"] .nb .bdg{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nb .bdg{color:#0E1014}}
.railfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.main{min-width:0;padding:24px 28px 96px;width:100%;max-width:1180px}
.tabbar{display:none}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hd h1{font-size:clamp(25px,3.2vw,32px);font-weight:800}
.hd .sub{color:var(--text-2);font-size:14px;margin-top:3px}

/* ================= PRIMITIVES ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.card.tint{background:color-mix(in srgb,var(--k-soft) 62%,var(--surface));border-color:var(--k-line)}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:9px}
.btw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wr{flex-wrap:wrap}
.eb{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 11px}
.sh h2{font-size:19px;font-weight:800}
.mu{color:var(--text-2)} .ti{font-size:12.5px}
hr.sp{border:0;border-top:1px solid var(--line);margin:13px 0}
.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:11px;min-height:44px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-weight:650;font-size:14px;
  cursor:pointer;transition:transform .1s,background .14s,border-color .14s,filter .14s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;stroke-width:2;fill:none;stroke:currentColor}
.btn.pri{background:var(--k-ink,var(--ac));border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E1014}}
.btn.pri:hover{filter:brightness(1.09);background:var(--k-ink,var(--ac))}
.btn.gh{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.gh:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:9px;min-height:38px}
.btn.xs{padding:5px 10px;font-size:12.5px;border-radius:8px;font-weight:650;min-height:32px}
.btn.dg{color:var(--crit);border-color:var(--crit-line)}
.btn.dg:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn.bl{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;
  font-weight:700;background:var(--k-soft,var(--surface-3));color:var(--k-ink,var(--text-2));border:1px solid var(--k-line,var(--line))}
.chip.pl{background:var(--surface-3);color:var(--text-2);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--k,var(--text-3));flex:none}

.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl label{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px;
  width:100%;min-width:0;transition:border-color .14s,background .14s;font-family:var(--ui)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--k,var(--ac));background:var(--surface)}
input[type=number],input.mo{font-family:var(--mo);font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--k,var(--ac))}
select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical;min-height:58px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;min-height:40px;border-radius:8px;font-size:13.5px;font-weight:650;
  color:var(--text-2);cursor:pointer;transition:background .14s,color .14s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg.k button.on{background:var(--k-ink);color:#fff}
:root[data-theme="dark"] .seg.k button.on{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.k button.on{color:#0E1014}}

/* ================= NUMBERS ================= */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.stat .lb{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.stat .vl{font-family:var(--dp);font-weight:800;font-size:28px;line-height:1.05;margin-top:6px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--k-ink,var(--text))}
.stat .vl small{font-size:13px;font-weight:600;color:var(--text-3);font-family:var(--ui);margin-left:3px;letter-spacing:0}
.stat .ft{font-size:12px;color:var(--text-2);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dl{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.dl.up{color:var(--good)} .dl.dn{color:var(--crit)} .dl.fl{color:var(--text-3)}

/* ================= BUDGET BAR ================= */
.budget{display:flex;flex-direction:column;gap:11px}
.bignum{font-family:var(--dp);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.track{position:relative;height:16px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--in);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.track .fill.over{background:var(--crit)}
.track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;border-radius:2px}
/* stacked "where the target came from" bar */
.calc{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.calc span{display:grid;place-items:center;font-family:var(--mo);font-size:11px;font-weight:600;color:#fff;
  min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
:root[data-theme="dark"] .calc span{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .calc span{color:#0E1014}}
.calc .c-base{background:var(--ac)}
.calc .c-act{background:var(--out)}
.calc .c-adj{background:var(--wt)}
.calc .c-neg{background:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11.5px;color:var(--text-2)}
.legend b{color:var(--text);font-family:var(--mo);font-weight:600}

.ring{--p:0;--rk:var(--in);width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;
  position:relative;background:conic-gradient(var(--rk) calc(var(--p)*1%),var(--surface-3) 0)}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.ring .rv{position:relative;z-index:1;text-align:center;line-height:1}
.ring .rv b{font-family:var(--dp);font-weight:800;font-size:31px;letter-spacing:-.04em;color:var(--text);font-variant-numeric:tabular-nums;display:block}
.ring .rv span{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:4px}

/* ================= LISTS ================= */
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);width:100%;text-align:left;transition:border-color .14s,transform .1s}
button.item{cursor:pointer}
button.item:hover{border-color:var(--k,var(--line-2));transform:translateX(2px)}
.item .ic{width:36px;height:36px;border-radius:11px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center;flex:none}
.item .ic svg{width:19px;height:19px;stroke-width:1.9;fill:none;stroke:currentColor}
.item .tt{font-weight:650;font-size:14.5px}
.item .mt{font-size:12.5px;color:var(--text-2);margin-top:1px}
.item .rt{margin-left:auto;text-align:right;flex:none}

.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:92px minmax(0,1fr) 62px;align-items:center;gap:9px;font-size:13px}
.br .tk{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.br .fi{height:100%;border-radius:5px;background:var(--k,var(--ac));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.br .nn{font-family:var(--mo);font-size:12px;color:var(--text-2);text-align:right}

/* ================= MEALS ================= */
.meal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.meal>header{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.meal>header h3{font-size:14.5px;font-weight:700}
.fe{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.fe:last-child{border-bottom:0}
.fe .nm{font-weight:600;font-size:14px}
.fe .qt{font-size:12px;color:var(--text-3);font-family:var(--mo)}
.fe .kc{margin-left:auto;font-family:var(--mo);font-weight:600;font-size:14px;white-space:nowrap}
.fe .ac{display:flex;gap:2px;opacity:0;transition:opacity .14s}
.fe:hover .ac,.fe:focus-within .ac{opacity:1}
@media (hover:none){.fe .ac{opacity:1}}
.macro{display:flex;gap:9px;font-size:11px;font-family:var(--mo);color:var(--text-3)}

/* ================= SETS TABLE ================= */
.exb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.exh{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.exh h3{font-size:15.5px;font-weight:700}
.st{width:100%;border-collapse:collapse;font-size:14px}
.st th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);font-weight:700;text-align:center;padding:7px 3px;border-bottom:1px solid var(--line)}
.st td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}
.st tr:last-child td{border-bottom:0}
.st tr.dn td{background:var(--good-soft)}
.st input{text-align:center;padding:11px 3px;border-radius:8px;font-size:16px;min-height:44px}
.st tr.dn input{background:transparent;border-color:transparent}
.sn{font-family:var(--mo);font-weight:500;font-size:13px;color:var(--text-2)}
.sn.wu{color:var(--warn)} .sn.dr{color:var(--out-ink)} .sn.fa{color:var(--crit)}
.pv{font-family:var(--mo);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.tick{width:40px;height:40px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface-2);cursor:pointer;
  display:grid;place-items:center;color:var(--text-3);transition:.14s;margin:0 auto}
.tick:hover{border-color:var(--good);color:var(--good)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.tick svg{width:19px;height:19px;stroke-width:3;fill:none;stroke:currentColor}
.pr{color:var(--warn);font-weight:800;font-size:10.5px;letter-spacing:.05em}

/* ================= CHARTS ================= */
.chart{width:100%;display:block}
.gl{stroke:var(--line);stroke-width:1}
.axl{font-family:var(--mo);font-size:10px;fill:var(--text-3)}

/* ================= VERDICT ================= */
.verdict{border-radius:var(--r);padding:18px;border:1px solid var(--k-line);
  background:color-mix(in srgb,var(--k-soft) 60%,var(--surface))}
.verdict .vt{font-family:var(--dp);font-weight:800;font-size:clamp(28px,5vw,38px);letter-spacing:-.04em;color:var(--k-ink);line-height:1}
.verdict ul{margin:11px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
.verdict li{font-size:13.5px;color:var(--text-2);line-height:1.5}
.disc{font-size:11.5px;color:var(--text-3);margin-top:11px;line-height:1.5}

/* ================= MODAL =================
   Sized to the VISUAL viewport, not the layout viewport. When a phone
   keyboard opens, vh does not change — which is what used to push the
   search results underneath it. --vvh/--vvtop are kept in step with
   window.visualViewport, so the sheet always ends where the keyboard
   begins and the list stays reachable. */
.scrim{position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100dvh);
  background:rgba(8,10,16,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;
  padding:0;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:560px;
  max-height:var(--vvh,100dvh);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0}
@media (min-width:600px){.scrim{align-items:center;padding:16px}
  .modal{border-radius:var(--r-lg);max-height:calc(var(--vvh,100dvh) - 32px)}}
.modal>header{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.modal>header h3{font-size:17.5px;font-weight:800}
.modal .bd{padding:15px 17px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
/* the head block (search field + filters) stays put while the list scrolls */
.modal .hdblk{flex:none;padding:14px 17px 0}
.modal>footer{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.x{width:31px;height:31px;border-radius:9px;border:0;background:var(--surface-2);color:var(--text-2);cursor:pointer;display:grid;place-items:center;flex:none}
.x:hover{background:var(--surface-3);color:var(--text)}
.x svg{width:16px;height:16px;stroke-width:2.2;fill:none;stroke:currentColor}
.pick-row{display:flex;align-items:center;gap:2px}
.pick-row .favbtn{width:34px;height:34px}
.pick-row .pick{flex:1;min-width:0}
.pick{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;
  width:100%;background:transparent;text-align:left}
.pick:hover{background:var(--surface-2);border-color:var(--line)}
.pick.on{background:var(--k-soft);border-color:var(--k-line)}
.tag{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:9.5px;font-weight:800;
  font-family:var(--dp);flex:none;letter-spacing:.01em}

table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:700;
  padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--surface-2)}

.empty{text-align:center;padding:34px 18px;color:var(--text-2)}
.empty svg{width:38px;height:38px;stroke-width:1.35;color:var(--text-3);margin-bottom:9px;fill:none;stroke:currentColor}
.empty h3{font-size:16.5px;margin-bottom:5px;color:var(--text)}
.toast{position:fixed;bottom:20px;right:20px;z-index:120;background:var(--text);color:var(--bg);padding:11px 16px;
  border-radius:11px;font-weight:650;font-size:14px;box-shadow:var(--shadow-lg);animation:pp .25s cubic-bezier(.2,1.2,.4,1);max-width:min(360px,86vw);
  display:flex;align-items:center;gap:14px}
.toast-undo{background:none;border:0;color:var(--ac-line,#8fa2ff);font-weight:800;font-size:13px;letter-spacing:.02em;
  cursor:pointer;padding:6px 2px;min-height:44px;flex:none}

/* ---- daily goals ---- */
.goallist{display:flex;flex-direction:column;gap:2px}
.goalitem{display:flex;align-items:center;gap:11px;padding:10px 2px;border:0;background:none;width:100%;text-align:left;
  border-bottom:1px solid var(--line);font:inherit;color:var(--text);cursor:default;min-height:44px}
button.goalitem{cursor:pointer}
.goalitem:last-child{border-bottom:0}
.goalitem .gi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--surface-3);color:var(--text-3)}
.goalitem .gi svg{width:15px;height:15px;stroke-width:2.4;fill:none;stroke:currentColor}
.goalitem.done .gi{background:var(--good-soft);color:var(--good)}
.goalitem .gn{font-weight:650;font-size:14px;flex:1}
.goalitem.done .gn{color:var(--text-2)}

/* ---- fitness score ---- */
.scorehero{display:flex;align-items:center;gap:18px;padding:6px 0 14px}
.score-ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.score-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.score-ring b{position:relative;z-index:1;font-family:var(--dp);font-weight:800;font-size:26px}
.score-ring span{position:relative;z-index:1;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}

/* ---- the big-three home hero: fitness / recovery / calories, one tap each ---- */
.bigthree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.bigthree button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:132px}
.bigthree button:active{transform:scale(.97)}
.bt-ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.bt-ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.bt-ring b{position:relative;z-index:1;font-family:var(--dp);font-weight:800;font-size:19px}
.bigthree .bt-label{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);text-align:center}
.bigthree .bt-sub{font-size:10px;color:var(--text-3);text-align:center;margin-top:-5px}
.score-bd{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.score-bd .sbrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.score-bd .sbrow .sbn{width:76px;flex:none;color:var(--text-2);font-weight:600}
.score-bd .sbrow .sbtrack{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.score-bd .sbrow .sbfill{display:block;height:100%;border-radius:3px}
.score-bd .sbrow .sbv{width:26px;flex:none;text-align:right;font-weight:700;font-family:var(--mo);font-size:11.5px}

/* ---- progress photos ---- */
.pthumb{border-radius:12px;overflow:hidden;background:var(--surface-3);flex:none;position:relative}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cmpwrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--surface-3)}
.cmpimg{position:absolute;inset:0}
.cmpimg img{width:100%;height:100%;object-fit:cover;display:block}
.cmpover{clip-path:inset(0 50% 0 0)}
.cmpslider{position:absolute;left:0;right:0;bottom:10px;width:calc(100% - 20px);margin:0 10px;z-index:2}
@keyframes pp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fd .28s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* quick-add grid */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;border-radius:13px;
  border:1px solid var(--k-line);background:color-mix(in srgb,var(--k-soft) 55%,var(--surface));color:var(--k-ink);
  font-weight:700;font-size:12.5px;cursor:pointer;transition:transform .1s,filter .14s}
.qa button:hover{filter:brightness(.97);transform:translateY(-1px)}
.qa button svg{width:21px;height:21px;stroke-width:1.9;fill:none;stroke:currentColor}

/* ================= MACRO ROWS ================= */
.mgrid{display:grid;gap:9px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;min-width:0}
.mrow .top{min-width:0}
.mrow .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.mrow .nm{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--k-ink)}
.mrow .vals{font-family:var(--mo);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mrow.wide{grid-column:1 / -1}
.mrow .vals b{font-size:15px;color:var(--text)}
.mrow .vals span{color:var(--text-3)}
.mrow .bar{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:5px;background:var(--k);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mrow .bar i.over{background:var(--crit)}
.mrow .rem{font-size:11.5px;color:var(--text-2);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.mrow .rem b{font-family:var(--mo);color:var(--text)}

/* ================= ACTIVITY LIST ================= */
.act{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.act:last-of-type{border-bottom:0}
.act .ic{width:36px;height:36px;border-radius:11px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center;flex:none}
.act .ic svg{width:19px;height:19px;stroke-width:1.9;fill:none;stroke:currentColor}
.act .kc{margin-left:auto;text-align:right;flex:none;font-family:var(--mo);font-weight:600;white-space:nowrap}
.srcb{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:1px 6px;border-radius:5px;border:1px solid var(--k-line);color:var(--k-ink);background:var(--k-soft)}
.acttot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;
  background:var(--surface-2);border-top:1px solid var(--line);font-weight:700}
.acttot .n{font-family:var(--mo);font-size:19px;color:var(--out-ink)}

/* ================= FAST ENTRY ================= */
.bigin{display:flex;flex-direction:column;gap:6px}
.bigin label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3)}
.bigin input{font-family:var(--mo);font-size:26px;font-weight:600;text-align:center;padding:14px 10px;min-height:62px;
  border-radius:13px;border-width:1.5px}
.bigin .unit{text-align:center;font-size:11.5px;color:var(--text-3)}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pillrow button{flex:1 1 auto;min-width:62px;padding:9px 8px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface-2);font-family:var(--mo);font-size:13.5px;font-weight:600;cursor:pointer;min-height:42px}
.pillrow button:hover{border-color:var(--k);color:var(--k-ink)}
.pillrow button.on{background:var(--k-ink);border-color:transparent;color:#fff}
:root[data-theme="dark"] .pillrow button.on{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pillrow button.on{color:#0E1014}}

/* ================= NL FOOD PARSER ================= */
.nlbox{border:1.5px solid var(--k-line);border-radius:var(--r);background:color-mix(in srgb,var(--k-soft) 45%,var(--surface));padding:13px}
.nlbox textarea{min-height:74px;font-size:16px;background:var(--surface);border-color:var(--line)}
.hint{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hint button{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);cursor:pointer;min-height:32px}
.hint button:hover{border-color:var(--k);color:var(--k-ink)}
.pline{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;background:var(--surface);margin-bottom:8px}
.pline.warn{border-color:var(--warn-line);background:color-mix(in srgb,var(--warn-soft) 45%,var(--surface))}
.pline .hd2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pline .hd2 b{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pgrid .fl label{font-size:9.5px}
.pgrid input{padding:8px 6px;min-height:40px;font-size:14px;text-align:center}
.qty2{display:grid;grid-template-columns:1fr 78px;gap:7px;margin-bottom:7px}

/* ================= UNSAVED BANNER ================= */
.livebar{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:11px;padding:10px 13px;
  border-radius:var(--r);border:1px solid var(--out-line);background:color-mix(in srgb,var(--out-soft) 70%,var(--surface));
  margin-bottom:13px;flex-wrap:wrap}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--out);flex:none;box-shadow:0 0 0 4px var(--out-soft)}

/* ================= REST TIMER (overhauled) ================= */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:85;background:var(--text);color:var(--bg);
  border-radius:18px;padding:14px 16px 13px;box-shadow:var(--shadow-lg);min-width:300px;max-width:min(440px,94vw);overflow:hidden}
.rest .done{font-size:12px;font-weight:700;opacity:.72;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.rest .done svg{width:14px;height:14px;stroke-width:3.2;fill:none;stroke:currentColor}
.rest .lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.6}
.rest .rt{font-family:var(--mo);font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.02;letter-spacing:-.03em}
.rest .acts{display:flex;gap:7px;margin-top:11px}
.rest .acts button{flex:1;background:rgba(127,127,127,.3);border:0;color:inherit;border-radius:11px;padding:11px 8px;
  font-size:13.5px;font-weight:700;cursor:pointer;min-height:44px;transition:background .14s}
.rest .acts button:hover{background:rgba(127,127,127,.5)}
.rest .rb{position:absolute;left:0;bottom:0;height:4px;background:var(--out);transition:width .95s linear}
.rest.over{background:var(--good);color:#06210F}
.rest.over .rb{background:rgba(0,0,0,.25)}
.rest.paused .rb{transition:none;opacity:.5}
@keyframes ring{0%,100%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.035)}}
.rest.over{animation:ring .5s ease 2}

/* active set */
.st tr.active td{background:color-mix(in srgb,var(--out-soft) 60%,transparent);box-shadow:inset 3px 0 0 var(--out)}
.st tr.active .sn{color:var(--out-ink);font-weight:700}
.exsum{font-family:var(--mo);font-size:12.5px;color:var(--text-2);margin-top:2px}

/* rest preset picker */
.restrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.restrow button{padding:12px 6px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);
  font-family:var(--mo);font-size:14px;font-weight:600;cursor:pointer;min-height:48px}
.restrow button.on{background:var(--out-ink);border-color:transparent;color:#fff}
:root[data-theme="dark"] .restrow button.on{color:#0E1014}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .restrow button.on{color:#0E1014}}

/* ================= ADD-FOOD LAUNCHER ================= */
.launch{display:flex;flex-direction:column;gap:9px}
.launch button{display:flex;align-items:center;gap:13px;padding:15px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;text-align:left;width:100%;min-height:66px;transition:border-color .14s,transform .1s}
.launch button:hover{border-color:var(--k);transform:translateX(2px)}
.launch button:disabled{opacity:.55;cursor:not-allowed}
.launch button:disabled:hover{transform:none;border-color:var(--line)}
.launch .ic{width:44px;height:44px;border-radius:13px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center;flex:none}
.launch .ic svg{width:22px;height:22px;stroke-width:1.9;fill:none;stroke:currentColor}
.launch b{font-size:15.5px;display:block}
.launch span.d{font-size:12.5px;color:var(--text-2);display:block;margin-top:1px}

/* ================= BARCODE SCANNER ================= */
.scan{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;display:grid;place-items:center}
.labelcap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;
  background:var(--surface-2);border:1.5px dashed var(--line-2);cursor:pointer}
.labelcap:active{background:var(--surface-3)}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;inset:18% 10%;border:2.5px solid rgba(255,255,255,.92);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan .laser{position:absolute;left:12%;right:12%;height:2px;background:var(--crit);box-shadow:0 0 8px var(--crit);
  animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:24%}50%{top:74%}}
.scan .msg{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;color:#fff;font-size:12.5px;
  font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.prod{display:flex;gap:12px;align-items:flex-start;margin-bottom:13px}
.prod .th{width:52px;height:52px;border-radius:12px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center;flex:none;font-weight:800}
.bcode{font-family:var(--mo);font-size:12px;color:var(--text-3);letter-spacing:.04em}

/* ================= GAME LAYER ================= */
/* Bright tiles carry dark ink; the deep hero gradient carries white.
   Every pairing below clears 4.5:1 — colour without losing legibility. */
:root{
  --g1:#5B32E0; --g2:#8B2FD6; --g3:#B02FA8;   /* hero, white text (5.5–7.0) */
  --ink:#17120A;                               /* text on bright tiles */
  --gc1:#FF9A2E; --gc2:#FFC94D;                /* calories  */
  --gp1:#2ED9A0; --gp2:#7DF0C4;                /* protein   */
  --gcb1:#B36BFF; --gcb2:#D9A8FF;              /* carbs     */
  --gf1:#FF6FA3; --gf2:#FFA3C4;                /* fat       */
  --gm1:#2BC4C4; --gm2:#6FE4DE;                /* movement  */
  --gw1:#9B6BFF; --gw2:#C0A0FF;                /* weight    */
  --gr1:#7E8FE0; --gr2:#A9B6F0;                /* rest      */
}
.hero{border-radius:22px;padding:17px 17px 15px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--g1),var(--g2) 58%,var(--g3));box-shadow:0 10px 28px -14px rgba(91,50,224,.85)}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 88% -10%,rgba(255,255,255,.32),transparent 42%),
  radial-gradient(circle at 6% 110%,rgba(255,255,255,.16),transparent 46%);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.lvl{width:62px;height:62px;border-radius:19px;background:rgba(255,255,255,.19);backdrop-filter:blur(4px);
  display:grid;place-items:center;flex:none;border:1.5px solid rgba(255,255,255,.34)}
.lvl-n{font-family:var(--dp);font-weight:800;font-size:27px;line-height:1;letter-spacing:-.04em}
.lvl-l{font-size:8px;letter-spacing:.18em;font-weight:800;opacity:.82;margin-top:1px}
.hero-name{font-family:var(--dp);font-weight:800;font-size:19px;letter-spacing:-.02em;margin-bottom:7px}
.xpbar{height:11px;border-radius:7px;background:rgba(0,0,0,.24);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.xpbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#FFE566,#FFF6C2);
  box-shadow:0 0 12px rgba(255,229,102,.9);transition:width .7s cubic-bezier(.2,.9,.2,1)}
.xp-meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:650;opacity:.92;margin-top:5px;
  font-family:var(--mo);font-variant-numeric:tabular-nums}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hs{background:rgba(255,255,255,.16);border-radius:13px;padding:9px 6px;text-align:center;border:1px solid rgba(255,255,255,.2)}
.hs-n{display:block;font-family:var(--dp);font-weight:800;font-size:20px;line-height:1;letter-spacing:-.03em}
.hs-l{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85;margin-top:3px}

/* big colourful stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{border-radius:19px;padding:14px;color:var(--ink);position:relative;overflow:hidden;min-width:0;
  box-shadow:0 8px 22px -14px rgba(0,0,0,.75)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% -18%,rgba(255,255,255,.42),transparent 55%);pointer-events:none}
.tile.big{grid-column:1/-1}
.g-cal{background:linear-gradient(135deg,var(--gc1),var(--gc2))}
.g-prot{background:linear-gradient(135deg,var(--gp1),var(--gp2))}
.g-carb{background:linear-gradient(135deg,var(--gcb1),var(--gcb2))}
.g-fat{background:linear-gradient(135deg,var(--gf1),var(--gf2))}
.g-move{background:linear-gradient(135deg,var(--gm1),var(--gm2))}
.g-food{background:linear-gradient(135deg,var(--gc1),var(--gc2))}
.g-weight{background:linear-gradient(135deg,var(--gw1),var(--gw2))}
.g-rest{background:linear-gradient(135deg,var(--gr1),var(--gr2))}
.tile-l{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.88;position:relative;z-index:1}
.tile-n{font-family:var(--dp);font-weight:800;font-size:31px;letter-spacing:-.04em;line-height:1.02;margin-top:5px;
  font-variant-numeric:tabular-nums;position:relative;z-index:1}
.tile-n small{font-size:13px;font-weight:700;opacity:.8;font-family:var(--ui);margin-left:3px}
.tile-s{font-size:11.5px;font-weight:650;opacity:.9;margin-top:4px;position:relative;z-index:1}
.tile-bar{height:8px;border-radius:5px;background:rgba(0,0,0,.16);overflow:hidden;margin-top:9px;position:relative;z-index:1}
.tile-bar i{display:block;height:100%;border-radius:5px;background:rgba(0,0,0,.55);transition:width .6s cubic-bezier(.2,.9,.2,1)}
.tile-bar i.over{background:#8A1020}

/* quests */
.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:15px;border:1.5px solid var(--line);
  background:var(--surface);transition:border-color .16s,transform .12s}
.quest.done{border-color:transparent;background:linear-gradient(135deg,rgba(0,184,148,.14),rgba(66,230,164,.1))}
.quest .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.quest .qi svg{width:19px;height:19px;stroke-width:2.1;fill:none;stroke:currentColor}
.quest .qt{font-weight:700;font-size:14.5px;display:block}
.quest .qs{font-size:12px;color:var(--text-2);font-family:var(--mo)}
.quest .qx{margin-left:auto;flex:none;font-family:var(--dp);font-weight:800;font-size:13px;color:var(--text-3);white-space:nowrap}
.quest.done .qx{color:var(--good)}
.qtick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;margin-left:auto}
.quest.done .qtick{background:var(--good);border-color:var(--good);color:#fff}
.qtick svg{width:15px;height:15px;stroke-width:3.4;fill:none;stroke:currentColor}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.badge{text-align:center;padding:12px 6px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);opacity:.42;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:transparent;
  background:linear-gradient(135deg,rgba(255,122,24,.16),rgba(255,185,46,.13));box-shadow:0 4px 14px -8px rgba(255,122,24,.7)}
.badge .bi{font-size:26px;line-height:1}
.badge .bn{font-size:11px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
.badge .bd{font-size:9.5px;color:var(--text-3);margin-top:1px;line-height:1.25}

/* quick padel buttons */
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.quick3 button{border:0;border-radius:16px;padding:15px 6px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#5B32E0,#7B4FE0);box-shadow:0 8px 20px -12px rgba(91,50,224,.95);
  transition:transform .12s,filter .16s;min-height:76px}
.quick3 button:hover{filter:brightness(1.08)}
.quick3 button:active{transform:scale(.96)}
.quick3 .q3n{display:block;font-family:var(--dp);font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1}
.quick3 .q3l{display:block;font-size:10.5px;font-weight:700;opacity:.9;margin-top:3px}

/* section heading, playful */
.gh{display:flex;align-items:center;gap:9px;margin:22px 0 11px}
.gh h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.gh .gh-x{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-3);font-family:var(--mo)}

@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,229,102,.55)}50%{box-shadow:0 0 0 9px rgba(255,229,102,0)}}
.levelup{animation:pulseGlow 1.5s ease 2}

/* ================= REORDER ================= */
.grip{width:36px;height:44px;border:0;background:transparent;color:var(--text-3);cursor:grab;flex:none;
  display:grid;place-items:center;touch-action:none;border-radius:9px}
.grip:active{cursor:grabbing;background:var(--surface-3)}
.grip svg{width:19px;height:19px;fill:none;stroke:currentColor}
.rrow{transition:transform .14s,box-shadow .14s,opacity .14s}
.rrow.dragging{opacity:.92;box-shadow:var(--shadow-lg);border-color:var(--out);transform:scale(1.015)}
.reorder.dragging-active .rrow:not(.dragging){opacity:.62}

/* ================= WORKOUT (focused logger) ================= */
.wk-top{position:sticky;top:0;z-index:30;background:var(--bg);padding:6px 0 10px;margin:-4px 0 0}
.wk-bar{display:flex;align-items:center;gap:10px}
.wk-bar .nm{font-family:var(--dp);font-weight:800;font-size:15px;letter-spacing:-.02em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-clock{font-family:var(--mo);font-size:13px;font-weight:600;color:var(--text-2);margin-left:auto;flex:none}
.pips{display:flex;gap:4px;margin-top:8px}
.pip{height:5px;flex:1;border-radius:3px;background:var(--surface-3);transition:background .2s}
.pip.done{background:var(--out)}
.pip.now{background:var(--ac)}

.exhead{display:flex;align-items:flex-start;gap:11px;margin:14px 0 4px}
.exhead h2{font-size:clamp(21px,5.4vw,27px);font-weight:800;letter-spacing:-.03em;line-height:1.1;min-width:0}
.exmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.prevline{font-family:var(--mo);font-size:12.5px;color:var(--text-2);margin-top:9px;
  background:var(--surface-2);border-radius:10px;padding:9px 11px;border:1px solid var(--line)}
.prevline b{color:var(--text)}

/* the set being worked on */
.setnow{border:2px solid var(--out);border-radius:20px;padding:15px;margin-top:13px;background:var(--surface);
  box-shadow:0 10px 26px -18px rgba(0,0,0,.5)}
.setnow .hdr{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.setnow .hdr b{font-family:var(--dp);font-size:19px;font-weight:800;letter-spacing:-.02em}
.setnow .hdr .of{font-size:13px;color:var(--text-2);font-weight:600}
.step{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:9px;align-items:center;margin-bottom:10px}
.step button{height:56px;border-radius:15px;border:1.5px solid var(--line-2);background:var(--surface-2);
  color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.step button:active{background:var(--surface-3);transform:scale(.94)}
.step button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6}
.step .val{text-align:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:15px;height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;min-width:0}
.step .val input{font-family:var(--mo);font-size:25px;font-weight:600;text-align:center;border:0;background:transparent;
  width:100%;padding:0;min-height:0;height:29px;letter-spacing:-.02em}
.step .val input:focus{outline:none}
.step .val span{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);margin-top:-1px}
.logbtn{width:100%;min-height:60px;border-radius:17px;border:0;font-family:var(--dp);font-size:17.5px;font-weight:800;
  letter-spacing:-.01em;color:#fff;background:var(--out-ink);cursor:pointer;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .1s,filter .15s}
:root[data-theme="dark"] .logbtn{color:#06201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logbtn{color:#06201F}}
.logbtn:active{transform:scale(.985);filter:brightness(1.08)}
.logbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.8}
.logbtn.allset{background:var(--ac)}

/* completed sets, compact */
.setlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.setchip{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:11px;background:var(--good-soft);
  border:1px solid var(--good-line);font-family:var(--mo);font-size:13px;font-weight:600;cursor:pointer}
.setchip .n{color:var(--good);font-weight:800}
.setchip.pending{background:var(--surface-2);border-color:var(--line);color:var(--text-3)}
.setchip .pr{color:var(--warn);font-size:10px;font-weight:800}

.exnav{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;margin-top:16px;align-items:center}
.exnav button{min-height:50px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);
  font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--text)}
.exnav button:disabled{opacity:.4}
.exnav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.3}
.exnav .mid{font-family:var(--mo);font-size:12.5px;color:var(--text-2);white-space:nowrap;padding:0 4px}

/* exercise jump sheet */
.jump{display:flex;flex-direction:column;gap:7px}
.jump button{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);text-align:left;cursor:pointer;width:100%;min-height:58px}
.jump button.on{border-color:var(--out);background:var(--out-soft)}
.jump .n{font-weight:700;font-size:14.5px;display:block}
.jump .s{font-size:12px;color:var(--text-2);font-family:var(--mo)}
.jump .tick{margin-left:auto;color:var(--good);flex:none}
.jump .tick svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:3}

/* macro strip for meals */
.mstrip{display:flex;gap:10px;font-family:var(--mo);font-size:11.5px;color:var(--text-2);flex-wrap:wrap}
.mstrip b{color:var(--text);font-weight:600}

/* ================================================================
   V2 — HIERARCHY OVER CARDS
   Sections use type + spacing + a hairline divider instead of a
   border+shadow box. A card is reserved for things that are genuinely
   a distinct object (a workout, a food entry) — not a wrapper around
   every paragraph.
   ================================================================= */
.sect{margin:26px 0 0}
.sect-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sect-hd h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.sect-hd .x{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--k-ink,var(--ac));cursor:pointer;background:none;border:0;padding:2px}
.hrule{border:0;border-top:1px solid var(--line);margin:22px 0}
.plain{background:transparent;border:0;box-shadow:none;padding:0}

/* ---- Today hero: the single dominant answer to "what do I do" ---- */
.today-hero{padding:2px 0 4px}
.today-eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.today-h1{font-family:var(--dp);font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:-.03em;line-height:1.05}
.today-rows{display:flex;flex-direction:column;margin-top:16px}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tl{font-size:14.5px;font-weight:650;color:var(--text-2);display:flex;align-items:center;gap:8px;flex:none}
.trow .tl svg{width:17px;height:17px;stroke-width:2;fill:none;stroke:currentColor;opacity:.75}
.trow .tv{font-family:var(--mo);font-size:17px;font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.trow .tv b{font-weight:700}
.trow .tv small{color:var(--text-3);font-weight:500;font-size:14px}
.trow.warn .tv{color:var(--crit)}
.trow button.tv-btn{background:none;border:0;font:inherit;color:var(--k-ink,var(--ac));font-weight:700;cursor:pointer;padding:0}

/* dominant CTA rail under the hero */
.cta-rail{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.cta-rail.solo{grid-template-columns:1fr}
.cta-main{grid-column:1/-1;min-height:58px;border-radius:16px;border:0;font-family:var(--dp);font-weight:800;
  font-size:16.5px;letter-spacing:-.01em;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--k-ink,var(--ac));box-shadow:0 10px 24px -14px var(--k-ink,var(--ac))}
:root[data-theme="dark"] .cta-main{color:#06110F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta-main{color:#06110F}}
.cta-main:active{transform:scale(.985)}
.cta-main svg{width:21px;height:21px;stroke-width:2.4;fill:none;stroke:currentColor}
.cta-sub{min-height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;
  font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)}
.cta-sub svg{width:18px;height:18px;stroke-width:2;fill:none;stroke:currentColor}
.cta-sub:active{background:var(--surface-2)}

/* ---- active workout banner: dominant when live ---- */
.resume-hero{border-radius:20px;padding:16px;position:relative;overflow:hidden;color:#fff;cursor:pointer;border:0;width:100%;text-align:left;
  background:linear-gradient(135deg,var(--gm1,#2BC4C4),var(--gm2,#6FE4DE));box-shadow:0 12px 28px -16px rgba(14,140,134,.7)}
.resume-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% -18%,rgba(255,255,255,.4),transparent 55%);pointer-events:none}
.resume-hero .rh-top{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:.85;position:relative;z-index:1}
.resume-hero .rh-dot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulseDot 1.6s ease infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.resume-hero .rh-name{font-family:var(--dp);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink);margin-top:5px;position:relative;z-index:1}
.resume-hero .rh-meta{font-size:13.5px;font-weight:600;color:var(--ink);opacity:.85;margin-top:2px;position:relative;z-index:1}
.resume-hero .rh-cta{margin-top:12px;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-weight:800;
  font-size:14.5px;display:inline-flex;align-items:center;gap:7px;position:relative;z-index:1}
.resume-hero .rh-cta svg{width:17px;height:17px;stroke-width:2.4;fill:none;stroke:currentColor}

/* ---- bottom sheet primitive (distinct from centered modal) ---- */
.sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--line-2);margin:8px auto 2px}

/* ---- favorite star ---- */
.favbtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--text-3);
  display:grid;place-items:center;cursor:pointer;flex:none}
.favbtn svg{width:19px;height:19px;stroke-width:1.8;fill:none;stroke:currentColor}
.favbtn.on{color:var(--warn)}
.favbtn.on svg{fill:currentColor}

/* ---- exercise picker: sectioned browse ---- */
.pk-sect{margin:0 0 4px}
.pk-sect-hd{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);
  padding:12px 2px 6px;display:flex;align-items:center;gap:7px}
.pk-sect-hd svg{width:14px;height:14px;stroke-width:2.2;fill:none;stroke:currentColor}
.pk-chiprow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pk-chiprow::-webkit-scrollbar{display:none}
.pk-mchip{flex:none;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:700;cursor:pointer;color:var(--text);min-height:40px;white-space:nowrap}
.pk-mchip.on{background:var(--out-ink);border-color:transparent;color:#fff}
:root[data-theme="dark"] .pk-mchip.on{color:#06201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pk-mchip.on{color:#06201F}}

/* ---- exercise detail sheet ---- */
.ex-hero{display:flex;align-items:center;gap:13px;padding:6px 0 4px}
.ex-hero .tag{width:46px;height:46px;font-size:13px;flex:none}
.exd-sect{margin-top:16px}
.exd-sect h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.exd-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--text-2);line-height:1.5}
.exd-hist{display:flex;flex-direction:column}
.exd-hrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.exd-hrow:last-child{border-bottom:0}
.exd-hrow .d{color:var(--text-3);font-size:12.5px}
.exd-hrow .v{font-family:var(--mo);font-weight:600}

/* ---- diff pill: +2.5kg / +1 rep / PR ---- */
.diffpill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:800;
  font-family:var(--mo)}
.diffpill.up{background:var(--good-soft);color:var(--good)}
.diffpill.down{background:var(--surface-3);color:var(--text-3)}
.diffpill.flat{background:var(--surface-3);color:var(--text-3)}
.diffpill.pr{background:var(--warn-soft);color:var(--warn-ink,var(--warn));animation:prPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes prPop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---- target range chip on an exercise ---- */
.targetchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mo);font-size:12px;font-weight:600;
  color:var(--text-2);background:var(--surface-2);border-radius:20px;padding:4px 10px}
.targetchip svg{width:12px;height:12px;stroke-width:2.2;fill:none;stroke:currentColor}
.targetchip.hit{background:var(--good-soft);color:var(--good)}

/* ---- rest strip: inline in the flow, showing what's next ---- */
.reststrip{border-radius:18px;padding:15px;background:linear-gradient(135deg,var(--gm1,#2BC4C4)16,var(--gm2,#6FE4DE)16);
  border:1.5px solid var(--out-line);margin-top:13px}
.reststrip .rs-top{display:flex;align-items:baseline;gap:9px}
.reststrip .rs-lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--out-ink)}
.reststrip .rs-clock{font-family:var(--mo);font-size:34px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.reststrip .rs-next{margin-top:9px;padding-top:11px;border-top:1px solid var(--out-line);display:flex;align-items:center;gap:10px}
.reststrip .rs-next .l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.reststrip .rs-next .v{font-family:var(--mo);font-size:15px;font-weight:600}
.reststrip .rs-acts{display:flex;gap:7px;margin-top:11px}
.reststrip .rs-acts button{flex:1;min-height:42px;border-radius:11px;border:1px solid var(--out-line);background:var(--surface);
  font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}

/* sorted weight log, oldest first */

/* Mifflin-St Jeor */

/* goal adjustment in kcal/day, with guard rails */
function goalAdjust(tdee) {

    return {
      mode: "manual", kcal,
      p: T.p > 0 ? Math.round(T.p) : autoM.p,
      c: T.c > 0 ? Math.round(T.c) : autoM.c,

/* ==================================================================
   IndexedDB — a tiny key/value wrapper, used only for progress-photo

   ================================================================== */

  if (idbPromise) return idbPromise;

    if (!window.indexedDB) { reject(new Error("no indexeddb")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;

  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(blob, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

          return "<tr><td><b>" + esc(o) + '</b></td><td class="mo">' + g.length + '</td><td class="mo">' + w + "–" + l +
            '</td><td class="mo" style="color:' + (pct == null ? "var(--text-3)" : pct >= 50 ? "var(--good)" : "var(--crit)") + '">' + (pct != null ? pct + "%" : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
  } else {
    h += '<div class="sect" style="margin-top:0"><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">' +
      miniStat("This week", wk.length, "sessions") +
      miniStat("Calories this week", nf(wkKcal), "kcal") +
      miniStat("Hours played", hrs, "h") + "</div></div>";
  }
  h += '<div class="ti mu" style="margin-top:9px">' + (watchN ? watchN + " of " + list.length + " sessions use your watch's calories" : "no watch figures logged yet — estimated so far") + "</div>";

  const weeks = Array.from({ length: 10 }, (_, i) => {
    const ws = shift(weekStart(today()), -(9 - i) * 7), we = shift(ws, 6);
    const wlist = (filter === "all" ? S.activities : S.activities.filter(a => a.type === filter)).filter(p => p.date >= ws && p.date <= we);
    return { v: wlist.reduce((a, p) => a + p.minutes, 0), c: "var(--wt)", t: "Week of " + fmtShort(ws) + " — " + wlist.length + " sessions" };
  });
  h += '<div class="card s-weight" style="margin-bottom:13px"><div class="eb" style="margin-bottom:9px">Minutes — last 10 weeks</div>' +
    barChart(weeks, { px: 100, label: "Activity minutes per week" }) + "</div>";

  h += '<div class="sh"><h2>History</h2></div>';
  h += list.length ? '<div class="stack">' + list.slice(0, 20).map(activityRow).join("") + "</div>"
    : '<div class="card"><div class="empty">' + I.activity + "<h3>No sessions yet</h3>" +
    '<p class="ti">Tap Log activity, pick a sport, type the duration and (if your watch shows it) the calories, save.</p>' +
    '<button class="btn pri s-weight" style="margin-top:12px" data-a="logactivity-pick">' + I.plus + "Log activity</button></div></div>";
  return h;
}
function openPadel(id) { openQuickPadel(id); }

/* one-tap padel from the dashboard: logs immediately with the estimate,
   and the toast points at the entry in case a watch figure should replace it */
function quickPadelLog(mins) {
  mins = clamp(Math.round(mins) || 60, 5, 600);
  const rec = {
    id: uid(), ts: Date.now(), type: "padel", date: today(), startTime: "",
    minutes: mins, distance: null, intensity: "moderate", intensitySet: false,
    watchKcal: null, heartRate: null, notes: "", kind: "match", opponent: "", partner: "", sets: [], result: "unset"
  };
  pushActivity(rec);
  save();
  const r = recordedKcal(rec, "padel");
  toast(durT(mins) + " padel logged — " + nf(r.kcal) + " kcal estimated. Tap it to add your watch figure.");
  render();
}

  if (o.line != null && max > 0) {
    const y = H - clamp(o.line / max, 0, 1) * (H - 2);
    s += '<line x1="0" y1="' + round(y, 2) + '" x2="100" y2="' + round(y, 2) + '" stroke="var(--text-2)" stroke-width="1" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>';
  }
  data.forEach((d, i) => {
    const h = d.v > 0 ? Math.max(0.8, d.v / max * (H - 2)) : 0;

  }
  let d = "", area = "";
  pts.forEach((p, i) => { const c = (i ? "L" : "M") + round(X(i), 1) + " " + round(Y(p.v), 1) + " "; d += c; area += c; });
  area += "L" + round(X(pts.length - 1), 1) + " " + (H - pad.b) + " L" + pad.l + " " + (H - pad.b) + " Z";
  s += '<path d="' + area + '" fill="url(#' + gid + ')"/>';
  s += '<path d="' + d + '" fill="none" stroke="var(--k)" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    if (last) s += '<circle cx="' + round(X(i), 1) + '" cy="' + round(Y(p.v), 1) + '" r="8" fill="var(--k)" opacity=".16"/>';
    s += '<circle cx="' + round(X(i), 1) + '" cy="' + round(Y(p.v), 1) + '" r="' + (last ? 4.4 : 2.3) + '" fill="' + (last ? "var(--k)" : "var(--surface)") +
      '" stroke="var(--k)" stroke-width="' + (last ? 2.4 : 1.6) + '"><title>' + esc(p.t || "") + "</title></circle>";
  });
  s += '<text class="axl" x="' + pad.l + '" y="' + (H - 5) + '">' + esc(pts[0].l || "") + "</text>";
  s += '<text class="axl" x="' + (W - pad.r) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(pts[pts.length - 1].l || "") + "</text>";
  return s + "</svg>";
}

/* ==================================================================
   TRAIN / LIGHT / REST
   General fitness guidance built from logged training only.
   ================================================================== */
function dayLoad(date) {
  if (CACHE.load[date] != null) return CACHE.load[date];
  let load = 0;
  S.workouts.filter(w => w.date === date).forEach(w => { load += workSets(w) * 1.1 + w.minutes * 0.16; });
  S.padel.filter(p => p.date === date).forEach(p => { load += p.minutes * ((INTENSITY[p.intensity] || INTENSITY.moderate).met / 7) * 0.55; });
  /* other cardio/activity types — padel itself already counted just above via S.padel */
  S.activities.filter(a => a.type !== "padel" && a.date === date).forEach(a => {
    const table = ACTIVITY_MET[a.type] || ACTIVITY_MET.other;
    load += a.minutes * ((table[a.intensity] || table.moderate).met / 7) * 0.55;
  });
  return (CACHE.load[date] = round(load, 1));
}
function loadWindow(days, offset) {
  offset = offset || 0;
  let sum = 0;
  for (let i = offset; i < offset + days; i++) sum += dayLoad(shift(today(), -i));
  return sum;
}
function historyDays() {
  const d = S.workouts.map(w => w.date).concat(S.padel.map(p => p.date), S.food.map(f => f.date), S.weights.map(w => w.date));
  if (!d.length) return 0;
  d.sort();
  return clamp(daysBetween(d[0], today()) + 1, 1, 400);
}
function trainedDays(n) {
  let c = 0;
  for (let i = 0; i < n; i++) { if (dayLoad(shift(today(), -i)) > 0) c++; }
  return c;
}
function consecutiveDays() {
  let c = 0, i = dayLoad(today()) > 0 ? 0 : 1;
  while (c < 21 && dayLoad(shift(today(), -i)) > 0) { c++; i++; }
  return c;
}
function recommendation() {
  const sessions = S.workouts.length + S.padel.length;
  const todayLoad = dayLoad(today());
  const yLoad = dayLoad(shift(today(), -1));
  const acute = loadWindow(7);
  /* Compare against however much history actually exists, up to 4 weeks.
     Dividing by a fixed 28 days would make every new user look like they
     had just doubled their training. */
  const hist = clamp(historyDays(), 7, 28);
  const chronic = loadWindow(hist) / (hist / 7);
  const provisional = hist < 21;
  const ratio = chronic > 0.5 ? acute / chronic : null;
  const streak = consecutiveDays();
  const freq = trainedDays(7);
  const burn7 = Array.from({ length: 7 }, (_, i) => activityOn(shift(today(), -i)).total).reduce((a, b) => a + b, 0);
  const rate = weightRate(21);
  const kg = currentWeight();
  const why = [];
  let fatigue = 0;

  if (sessions < 3) {
    return {
      verdict: "TRAIN", cls: "s-good", headline: "Go ahead and train.",
      why: ["Only " + sessions + " session" + (sessions === 1 ? "" : "s") + " logged so far — there is not enough history to spot a heavy stretch yet.",
        "Log your gym and padel sessions for a week or two and this read gets much sharper."],
      recap: "", fatigue: 0, ratio, streak, freq, burn7: Math.round(burn7), thin: true
    };
  }

  if (ratio != null) {
    if (ratio > 1.6) { fatigue += 34; why.push("Your last 7 days carry " + round(ratio, 2) + "× your " + (provisional ? hist + "-day" : "4-week") + " average load — a sharp jump."); }
    else if (ratio > 1.3) { fatigue += 18; why.push("This week is running " + round(ratio, 2) + "× your recent average — slightly ahead of what you have been used to." + (provisional ? " (Only " + hist + " days of history so far, so treat that loosely.)" : "")); }
    else if (ratio < 0.7) { fatigue -= 12; why.push("This week sits at " + round(ratio, 2) + "× your " + (provisional ? "recent" : "4-week") + " average, so you are carrying little accumulated fatigue."); }
    else why.push("Weekly load is " + round(ratio, 2) + "× your " + (provisional ? hist + "-day" : "4-week") + " average — a steady place to be.");
  }
  if (streak >= 6) { fatigue += 28; why.push(streak + " days in a row with something logged and no full rest day."); }
  else if (streak >= 4) { fatigue += 15; why.push(streak + " consecutive active days."); }
  else if (streak === 0) { fatigue -= 10; why.push("You rested yesterday, so you are starting fresh."); }

  if (todayLoad > 0) {
    fatigue += 26;
    const a = activityOn(today());
    why.push("You have already logged " + [a.nGym ? a.nGym + " gym session" + (a.nGym > 1 ? "s" : "") : "", a.nPadel ? a.nPadel + " padel session" + (a.nPadel > 1 ? "s" : "") : ""].filter(Boolean).join(" and ") + " today (about " + nf(a.total) + " kcal).");
  }
  if (yLoad > 14) { fatigue += 12; why.push("Yesterday was a heavy day."); }
  if (freq >= 6) { fatigue += 12; why.push(freq + " of the last 7 days had training in them."); }
  else if (freq <= 2) { fatigue -= 8; why.push("Only " + freq + " active day" + (freq === 1 ? "" : "s") + " in the last week."); }

  /* recently hammered muscle groups */
  const recent48 = MGK.filter(m => { const d = lastTrained(m); return d && daysBetween(d, today()) <= 1 && m !== "fullbody"; });
  if (recent48.length >= 5) { fatigue += 10; why.push(recent48.slice(0, 4).map(m => MG[m].n.toLowerCase()).join(", ") + " and others were trained in the last 48 hours."); }
  else if (recent48.length) why.push("Trained in the last 48h: " + recent48.map(m => MG[m].n.toLowerCase()).join(", ") + ".");

  /* fuelling: a deep deficit blunts recovery */
  let eat3 = 0, tgt3 = 0, days3 = 0;
  for (let i = 1; i <= 3; i++) {
    const d = shift(today(), -i);
    const b = budget(d);
    if (b.eaten > 0) { eat3 += b.eaten; tgt3 += b.target; days3++; }
  }
  if (days3 >= 2) {
    const gap = (eat3 - tgt3) / days3;
    if (gap < -600) { fatigue += 16; why.push("You have been averaging " + nf(Math.abs(gap)) + " kcal below target over the last few days, which makes recovery harder."); }
    else if (gap > 500) why.push("You have been eating above target lately, so fuel is not the limiter.");
  }
  if (rate != null && kg) {
    const pctWk = Math.abs(rate) / kg * 100;
    if (rate < 0 && pctWk > 1.1) { fatigue += 12; why.push("Trend weight is falling " + round(Math.abs(rate), 2) + " kg/week (" + round(pctWk, 1) + "% of body weight) — fast enough to cost you strength."); }
    else if (rate != null) why.push("Trend weight is " + (Math.abs(rate) < 0.05 ? "flat" : (rate > 0 ? "up " : "down ") + round(Math.abs(rate), 2) + " kg/week") + " over the last three weeks.");
  }

  /* a one-line recap of what actually happened recently */
  let recap = "";
  {
    const win = 4;
    const cut = shift(today(), -(win - 1));
    const g = S.workouts.filter(w => w.date >= cut);
    const pd = S.padel.filter(p => p.date >= cut);
    const hard = pd.filter(p => p.intensity === "hard").length;
    const bits = [];
    if (pd.length) bits.push((hard >= Math.ceil(pd.length / 2) && hard > 0 ? hard + " hard " : pd.length + " ") + "padel session" + (pd.length === 1 ? "" : "s"));
    if (g.length) bits.push(g.length + " gym session" + (g.length === 1 ? "" : "s"));
    if (bits.length) {
      const restDays = win - trainedDays(win);
      recap = bits.join(" + ") + " in the last " + win + " days" +
        (restDays ? ", " + restDays + " rest day" + (restDays === 1 ? "" : "s") : ", no rest days") + ".";
    }
  }
  fatigue = clamp(Math.round(fatigue), 0, 100);
  let verdict, cls, headline;
  if (fatigue >= 62) { verdict = "REST"; cls = "s-crit"; headline = "Your recent training load is high. A rest or recovery day would be beneficial."; }
  else if (fatigue >= 34) { verdict = "LIGHT SESSION"; cls = "s-warn"; headline = "You've had several high-activity days. Consider a lighter workout."; }
  else { verdict = "TRAIN"; cls = "s-good"; headline = "You appear recovered enough for another workout."; }
  return { verdict, cls, headline, recap, why: why.slice(0, 5), fatigue, ratio, streak, freq, burn7: Math.round(burn7), thin: false };
}

/* ==================================================================
   WEEKLY OVERVIEW
   ================================================================== */
function weekStats(endDate) {
  endDate = endDate || today();
  const start = shift(endDate, -6);
  let eaten = 0, daysWithFood = 0, burn = 0, minutes = 0;
  for (let d = start; d <= endDate; d = shift(d, 1)) {
    const f = S.food.filter(x => x.date === d).reduce((a, b) => a + b.kcal, 0);
    if (f > 0) { eaten += f; daysWithFood++; }
    const a = activityOn(d);
    burn += a.total; minutes += a.minutes;
  }
  const gym = S.workouts.filter(w => w.date >= start && w.date <= endDate).length;
  const pad = S.padel.filter(p => p.date >= start && p.date <= endDate).length;
  const rest = 7 - trainedDays(7);
  return {
    start, end: endDate, avgKcal: daysWithFood ? Math.round(eaten / daysWithFood) : null, daysWithFood,
    burn: Math.round(burn), minutes, gym, padel: pad, rest, rate: weightRate(21)
  };
}
